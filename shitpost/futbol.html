<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Abdullah'ın Balonları</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  canvas#gl { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .cap {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: "DejaVu Sans", sans-serif; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 4px 4px 0 #000; letter-spacing: 1px; white-space: pre-line; transform-origin: 50% 50%;
  }
  #top { top: 28px; font-size: 60px; }
  #bot { bottom: 34px; font-size: 48px; }
  #bubble {
    position: absolute; background: #fff; color: #111; border: 5px solid #000; border-radius: 18px;
    padding: 14px 22px; font: 800 36px "DejaVu Sans", sans-serif; white-space: pre-line; text-align: center; display: none;
  }
  #bubble:after { content: ""; position: absolute; left: 50%; bottom: -26px; margin-left: -14px; border: 14px solid transparent; border-top-color: #000; }
  .pat { position: absolute; font: 900 110px "DejaVu Sans", sans-serif; color: #ffe14d;
    -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 6px 6px 0 #000; display: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; }
  #bars { position: absolute; inset: 0; pointer-events: none; opacity: 0; border-top: 80px solid #000; border-bottom: 80px solid #000; box-sizing: border-box; }
  #slowmo { position: absolute; left: 30px; top: 110px; font: 900 34px "DejaVu Sans Mono", monospace; color: #fff;
    -webkit-text-stroke: 2px #000; paint-order: stroke fill; display: none; }
  #wm { position: absolute; right: 14px; top: 10px; font: 700 18px "DejaVu Sans Mono", monospace; color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

  <canvas id="gl" width="1280" height="720"></canvas>

  <div class="pat" id="p0"></div><div class="pat" id="p1"></div><div class="pat" id="p2"></div><div class="pat" id="p3"></div><div class="pat" id="p4"></div><div class="pat" id="p5"></div>

</div>
<script src="three.min.js"></script>
<script>
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const easeOut = k => { k = clamp(k, 0, 1); return 1 - (1 - k) * (1 - k); };
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1280, 720, false); renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const SKY = new THREE.Color(0x86ccff);
scene.background = SKY.clone(); scene.fog = new THREE.Fog(0x86ccff, 40, 90);
const camera = new THREE.PerspectiveCamera(55, 1280 / 720, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7a35, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(10, 20, 6); scene.add(sun);

function canvasTex(w, h, draw, nearest = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noiseFill(g, w, h, base, vary, seed) {
  const r = rng(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = (r() - 0.5) * vary; const c = base.map(ch => clamp(Math.round(ch + v), 0, 255));
    g.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(x, y, 1, 1);
  }
}
const box1 = new THREE.BoxGeometry(1, 1, 1);
function block(mat, sx, sy, sz, x, y, z, parent = scene) { const m = new THREE.Mesh(box1, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m; }
const M = c => new THREE.MeshLambertMaterial({ color: c });
const B = c => new THREE.MeshBasicMaterial({ color: c });

// --- Pitch: 30 x 20, goal on the right (x = 13) -----------------------------------
const pitchTex = canvasTex(320, 200, (g) => {
  for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#4f9e3a' : '#5aad43'; g.fillRect(i * 32, 0, 32, 200); }
  const r = rng(5); for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(0,0,0,${r() * 0.08})`; g.fillRect(r() * 320, r() * 200, 1, 1); }
  g.strokeStyle = '#fff'; g.lineWidth = 2;
  g.strokeRect(10, 10, 300, 180); g.beginPath(); g.moveTo(160, 10); g.lineTo(160, 190); g.stroke();
  g.beginPath(); g.arc(160, 100, 26, 0, Math.PI * 2); g.stroke();
  g.strokeRect(10, 60, 36, 80); g.strokeRect(274, 60, 36, 80);
});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(32, 20), new THREE.MeshLambertMaterial({ map: pitchTex }));
pitch.rotation.x = -Math.PI / 2; scene.add(pitch);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshLambertMaterial({ map: canvasTex(16, 16, (g, w, h) => noiseFill(g, w, h, [90, 150, 70], 40, 6)) }));
outer.material.map.wrapS = outer.material.map.wrapT = THREE.RepeatWrapping; outer.material.map.repeat.set(60, 60);
outer.rotation.x = -Math.PI / 2; outer.position.y = -0.02; scene.add(outer);
// goal
const white = B(0xffffff);
block(white, 0.2, 2.4, 0.2, 14.5, 1.2, -2.5); block(white, 0.2, 2.4, 0.2, 14.5, 1.2, 2.5); block(white, 0.2, 0.2, 5.2, 14.5, 2.4, 0);
const net = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.4, 5), new THREE.MeshBasicMaterial({ color: 0xdddddd, wireframe: true }));
net.position.set(15.2, 1.2, 0); scene.add(net);
// fence + banners + crowd stands behind the far touchline (z = -11)
const fenceM = new THREE.MeshBasicMaterial({ color: 0x1d3b1d, wireframe: true });
[-10.6, 10.6].forEach(z => { const f = new THREE.Mesh(new THREE.PlaneGeometry(34, 3, 34, 3), fenceM); f.position.set(0, 1.5, z); scene.add(f); });
function banner(text, bg, x, z, w = 8) {
  const t = canvasTex(512, 64, (g) => { g.fillStyle = bg; g.fillRect(0, 0, 512, 64); g.fillStyle = '#fff'; g.font = 'bold 40px DejaVu Sans'; g.textAlign = 'center'; g.fillText(text, 256, 47); }, false);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 1), new THREE.MeshBasicMaterial({ map: t })); m.position.set(x, 0.6, z); scene.add(m); return m;
}
banner("ABDULLAH'IN DOĞUM GÜNÜ 🎂", '#d6336c', -6, -10.9);
banner('MİNECRAFT TR HALI SAHA', '#1f5fbf', 5, -10.9);
const stand = new THREE.Group(); scene.add(stand);
{ const r = rng(42); const crowdCols = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xffffff, 0xe67e22];
  for (let row = 0; row < 3; row++) {
    block(M(0x8a8a8a), 34, 0.6, 1.4, 0, 0.3 + row * 0.8, -13 - row * 1.4, stand);
    for (let i = 0; i < 26; i++) { const p = block(M(crowdCols[Math.floor(r() * 7)]), 0.6, 0.9, 0.5, -15 + i * 1.2 + r() * 0.4, 1.05 + row * 0.8, -13 - row * 1.4, stand); p.userData.ph = r() * 6; }
    for (let i = 0; i < 26; i++) {} } }
const crowd = stand.children.filter(c => c.userData.ph !== undefined);
// clouds
const clouds = []; { const r = rng(77); for (let i = 0; i < 9; i++) { const c = block(B(0xffffff), 4 + r() * 5, 1, 2 + r() * 3, -40 + r() * 80, 22 + r() * 5, -40 + r() * 30); clouds.push(c); } }

// --- Characters -------------------------------------------------------------------
function faceTex(o, mode) {
  return canvasTex(8, 8, (g) => {
    g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, 0, 8, 2);
    const eyes = () => { g.fillStyle = '#fff'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1); g.fillStyle = o.eye; g.fillRect(2, 3, 1, 1); g.fillRect(5, 3, 1, 1); };
    if (mode === 'normal') { eyes(); g.fillStyle = '#5a2a1a'; g.fillRect(3, 6, 2, 1); }
    else if (mode === 'happy') { g.fillStyle = '#000'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1); g.fillStyle = '#7a1010'; g.fillRect(2, 5, 4, 1); g.fillRect(3, 6, 2, 1); g.fillStyle = '#fff'; g.fillRect(2, 5, 4, 1); g.fillStyle = '#ff8a8a'; g.fillRect(0, 5, 1, 1); g.fillRect(7, 5, 1, 1); }
    else if (mode === 'cool') { g.fillStyle = '#000'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1); g.fillStyle = '#5a2a1a'; g.fillRect(4, 6, 3, 1); g.fillRect(6, 5, 1, 1); }
    else if (mode === 'shock') { g.fillStyle = '#fff'; g.fillRect(1, 2, 2, 3); g.fillRect(5, 2, 2, 3); g.fillStyle = '#000'; g.fillRect(2, 3, 1, 1); g.fillRect(5, 3, 1, 1); g.fillStyle = '#300'; g.fillRect(3, 5, 2, 3); }
    else if (mode === 'cry') { g.fillStyle = '#000'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1); g.fillRect(1, 2, 1, 1); g.fillRect(6, 2, 1, 1); g.fillStyle = '#3fa9ff'; g.fillRect(1, 4, 1, 4); g.fillRect(6, 4, 1, 4); g.fillStyle = '#300'; g.fillRect(3, 6, 2, 1); g.fillRect(2, 7, 1, 1); g.fillRect(5, 7, 1, 1); }
    else if (mode === 'stone') { g.fillStyle = '#000'; g.fillRect(1, 2, 6, 1); g.fillStyle = '#222'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1); g.fillStyle = '#3a1a10'; g.fillRect(2, 6, 4, 1); }
  });
}
function makeChar(o) {
  const root = new THREE.Group(); root.rotation.order = 'YXZ';
  const skinM = M(o.skin), hairM = M(o.hair);
  const shirtM = o.shirtMap ? new THREE.MeshLambertMaterial({ map: o.shirtMap }) : M(o.shirt);
  const pantsM = M(o.pants);
  const faces = {}; ['normal', 'happy', 'cool', 'shock', 'cry', 'stone'].forEach(k => faces[k] = new THREE.MeshLambertMaterial({ map: faceTex(o, k) }));
  const headMats = [hairM, hairM, hairM, skinM, faces.normal, hairM];
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMats);
  const headPivot = new THREE.Group(); headPivot.position.y = 1.5; head.position.y = 0.4; headPivot.add(head);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), shirtM); body.position.y = 1.05;
  if (o.number) {
    const nt = canvasTex(64, 64, (g) => { g.fillStyle = '#fff'; g.font = 'bold 44px DejaVu Sans'; g.textAlign = 'center'; g.fillText(o.number, 32, 48); }, false);
    const n = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: nt, transparent: true }));
    n.position.set(0, 0.05, -0.21); n.rotation.y = Math.PI; body.add(n);
  }
  function limb(mat, w, h, x, y, endMat) { const p = new THREE.Group(); p.position.set(x, y, 0); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.y = -h / 2; p.add(m);
    if (endMat) { const e = new THREE.Mesh(new THREE.BoxGeometry(w + 0.02, 0.2, w + 0.06), endMat); e.position.set(0, -h + 0.1, 0.02); p.add(e); } return p; }
  const armL = limb(shirtM, 0.3, 0.85, -0.55, 1.48, skinM), armR = limb(shirtM, 0.3, 0.85, 0.55, 1.48, skinM);
  const legL = limb(pantsM, 0.38, 0.6, -0.2, 0.6, M(o.boots || 0x111111)), legR = limb(pantsM, 0.38, 0.6, 0.2, 0.6, M(o.boots || 0x111111));
  root.add(headPivot, body, armL, armR, legL, legR); scene.add(root);
  return { root, head, headPivot, armL, armR, legL, legR, setFace(k) { headMats[4] = faces[k]; head.material = headMats; } };
}
const abd = makeChar({ skin: '#e0ac7e', hair: '#2a1a0e', shirt: '#2f7de1', pants: '#f2f2f2', eye: '#3b2412', number: '10' });
// party hat (pyramid = blocky cone)
const hat = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.75, 4), new THREE.MeshLambertMaterial({ map: canvasTex(8, 8, (g) => { for (let i = 0; i < 8; i++) { g.fillStyle = ['#ff4fa3', '#ffe14d', '#4fd1ff'][i % 3]; g.fillRect(0, i, 8, 1); } }) }));
hat.position.y = 0.775; hat.rotation.y = Math.PI / 4; abd.head.add(hat);
const pom = block(B(0xffffff), 0.14, 0.14, 0.14, 0, 1.15, 0, abd.head);
const team = [
  makeChar({ skin: '#c98d5e', hair: '#111', shirt: '#2f7de1', pants: '#f2f2f2', eye: '#333', number: '7' }),
  makeChar({ skin: '#f0c49a', hair: '#d9a520', shirt: '#2f7de1', pants: '#f2f2f2', eye: '#333', number: '4' }),
  makeChar({ skin: '#b67b52', hair: '#222', shirt: '#2f7de1', pants: '#f2f2f2', eye: '#333', number: '9' }),
];
const keeper = makeChar({ skin: '#e8b88f', hair: '#5a3a1a', shirt: '#f1c40f', pants: '#222', eye: '#333', number: '1' });
const rakip = makeChar({ skin: '#d29a6b', hair: '#1b1b1b', shirt: '#e23b3b', pants: '#222', eye: '#222', number: '99' });
const refShirt = canvasTex(8, 8, (g) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#111' : '#f5f5f5'; g.fillRect(i, 0, 1, 8); } });
const hakem = makeChar({ skin: '#c98d5e', hair: '#555', shirtMap: refShirt, pants: '#111', eye: '#222' });
const redCard = block(B(0xe01b1b), 0.3, 0.45, 0.04, 0, -0.9, 0.25, hakem.armR);

// ball
const ballTex = canvasTex(8, 8, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 8, 8); g.fillStyle = '#111'; [[1, 1], [5, 2], [2, 5], [6, 6], [3, 3]].forEach(([x, y]) => g.fillRect(x, y, 2, 2)); });
const ball = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshLambertMaterial({ map: ballTex })); scene.add(ball);

// --- Balloons (blocky, of course) ---------------------------------------------------------
const BCOL = [0xff3b6b, 0xffd23f, 0x3fc1ff, 0x7dff6b, 0xb36bff];
const POP = [9.25, 9.65, 9.98, 10.25, 10.5];       // when each balloon pops
const balloons = BCOL.map((c, i) => {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.85, 0.7), new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: 0.15 }));
  const shine = block(B(0xffffff), 0.12, 0.2, 0.02, -0.18, 0.18, 0.36, body);
  const knot = block(M(c), 0.18, 0.15, 0.18, 0, -0.5, 0, g);
  g.add(body); scene.add(g);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffffff })); scene.add(line);
  // shards for the pop
  const r = rng(300 + i); const shards = [];
  for (let k = 0; k < 14; k++) { const s = block(B(c), 0.12 + r() * 0.12, 0.12 + r() * 0.12, 0.03, 0, 0, 0); s.userData = { v: V((r() - 0.5) * 9, r() * 7, (r() - 0.5) * 9), sp: (r() - 0.5) * 30 }; s.visible = false; shards.push(s); }
  return { g, body, line, shards, color: c };
});
// spare balloon that comes back at the end
const lastBalloon = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.85, 0.7), new THREE.MeshLambertMaterial({ color: 0xff3b6b, emissive: 0xff3b6b, emissiveIntensity: 0.2 }));
scene.add(lastBalloon);
const lastShards = []; { const r = rng(999); for (let k = 0; k < 20; k++) { const s = block(B(0xff3b6b), 0.15, 0.15, 0.03, 0, 0, 0); s.userData = { v: V((r() - 0.5) * 8, r() * 6, (r() - 0.5) * 8), sp: (r() - 0.5) * 30 }; s.visible = false; lastShards.push(s); } }

// sparks + dust while sliding
const sparks = []; for (let i = 0; i < 40; i++) { const s = block(B(i % 2 ? 0xfff2a0 : 0xffffff), 0.07, 0.07, 0.07, 0, 0, 0); s.visible = false; sparks.push(s); }
const dust = []; for (let i = 0; i < 30; i++) { const s = block(new THREE.MeshBasicMaterial({ color: 0x8a6b45, transparent: true, opacity: 0.7 }), 0.25, 0.25, 0.25, 0, 0, 0); s.visible = false; dust.push(s); }
// personal rain cloud + tears
const rainCloud = new THREE.Group(); scene.add(rainCloud);
block(M(0x555a66), 2.2, 0.6, 1.4, 0, 0, 0, rainCloud); block(M(0x4a4f5a), 1.2, 0.5, 1.0, 0.5, 0.35, 0, rainCloud);
const drops = []; { const r = rng(12); for (let i = 0; i < 40; i++) { const d = block(B(0x6fb6ff), 0.05, 0.3, 0.05, 0, 0, 0); d.userData = { x: (r() - 0.5) * 2, z: (r() - 0.5) * 1.2, o: r() }; drops.push(d); } }
const tears = []; for (let i = 0; i < 12; i++) tears.push(block(B(0x3fa9ff), 0.1, 0.12, 0.1, 0, 0, 0));
// coffin for the funeral
const coffin = new THREE.Group(); scene.add(coffin);
block(M(0x5a3a1e), 2.2, 0.5, 1.5, 0, 0, 0, coffin); block(M(0x7a5230), 2.25, 0.08, 1.55, 0, 0.29, 0, coffin);
block(M(0xff3b6b), 0.6, 0.06, 0.45, -0.3, 0.37, 0, coffin).rotation.y = 0.4;  // deflated balloon on top
block(M(0x3fc1ff), 0.5, 0.06, 0.4, 0.4, 0.37, 0.05, coffin).rotation.y = -0.3;

// --- DOM helpers ------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function cap(id, text, scale = 1, rot = 0, color = '#fff') { const el = $(id); el.textContent = text || ''; el.style.transform = `scale(${scale}) rotate(${rot}deg)`; el.style.color = color; }
function bubble(text, worldPos) {
  const el = $('bubble'); if (!text) { el.style.display = 'none'; return; }
  el.style.display = 'block'; el.textContent = text;
  const p = worldPos.clone().project(camera); const x = (p.x * 0.5 + 0.5) * 1280, y = (-p.y * 0.5 + 0.5) * 720;
  el.style.left = clamp(x - el.offsetWidth / 2, 10, 1270 - el.offsetWidth) + 'px'; el.style.top = clamp(y - el.offsetHeight - 30, 110, 560 - el.offsetHeight) + 'px';
}
function flash(color, a) { $('flash').style.background = color; $('flash').style.opacity = a; }
function pat(i, text, x, y, s, rot) { const e = $('p' + i); e.style.display = 'block'; e.textContent = text; e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.transform = `scale(${s}) rotate(${rot}deg)`; }

// --- Poses ------------------------------------------------------------------------------
const ALL = [abd, ...team, keeper, rakip, hakem];
function resetChar(c) {
  c.root.position.set(0, -50, 0); c.root.rotation.set(0, 0, 0); c.root.visible = true;
  c.headPivot.rotation.set(0, 0, 0); c.head.scale.setScalar(1);
  [c.armL, c.armR, c.legL, c.legR].forEach(l => l.rotation.set(0, 0, 0)); c.setFace('normal');
}
function run(c, t, sp = 12, a = 0.9) { const s = Math.sin(t * sp); c.legL.rotation.x = s * a; c.legR.rotation.x = -s * a; c.armL.rotation.x = -s * a; c.armR.rotation.x = s * a; c.root.position.y = Math.abs(Math.cos(t * sp)) * 0.1; }
function place(c, x, z, ry) { c.root.position.set(x, 0, z); c.root.rotation.set(0, ry, 0); }
const face = (dx, dz) => Math.atan2(dx, dz);  // yaw that makes a character look along (dx, dz)
function hip(c) { c.root.updateMatrixWorld(true); return c.root.localToWorld(V(0, 0.75, 0)); }

// Abdullah's path: idles at (-2, 6.5), runs in, slides from (-2, 5) to (-1.4, -3.5)
function abdState(t) {
  if (t < 6.4) return { x: -2, z: 6.5, mode: 'stand' };
  if (t < 7.6) { const k = seg(t, 6.4, 7.6); return { x: -2, z: lerp(6.5, 5, k), mode: 'run' }; }
  if (t < 10.8) { const k = easeOut(seg(t, 7.6, 10.8)); return { x: lerp(-2, -1.4, k), z: lerp(5, -3.5, k), mode: 'slide', k: seg(t, 7.6, 10.8) }; }
  return { x: -1.4, z: -3.5, mode: 'lying' };
}
// The opponent dribbles along z = 0, hops over Abdullah, then scores
function rakipX(t) { if (t < 9.4) return -10 + (t - 3.5) * 1.5; return -1.15 + (t - 9.4) * 4.2; }

// --- Timeline -------------------------------------------------------------------------------
const DURATION = 29.5;
function renderAt(t) {
  ALL.forEach(resetChar);
  let filter = 'none', shake = 0;
  cap('top', ''); cap('bot', ''); bubble(null); flash('#fff', 0);
  $('bars').style.opacity = 0; $('slowmo').style.display = 'none';
  for (let i = 0; i < 6; i++) $('p' + i).style.display = 'none';
  scene.background.copy(SKY); scene.fog.color.copy(SKY);
  rainCloud.visible = false; drops.forEach(d => d.visible = false); tears.forEach(d => d.visible = false);
  coffin.visible = false; redCard.visible = false; lastBalloon.visible = false; lastShards.forEach(s => s.visible = false);
  sparks.forEach(s => s.visible = false); dust.forEach(s => s.visible = false); ball.visible = true;
  crowd.forEach(p => p.position.y = p.userData.base ?? (p.userData.base = p.position.y));
  camera.fov = 55; camera.up.set(0, 1, 0);
  const cheer = (amp) => crowd.forEach(p => p.position.y = p.userData.base + Math.abs(Math.sin(t * 9 + p.userData.ph)) * amp);
  cheer(0.08);

  // ---------------- background actors (play in every scene where relevant) ----------------
  const A = abdState(t);
  // keeper stands in front of the goal
  place(keeper, 13.4, 0, -Math.PI / 2);
  // teammates jog around in the first half
  team.forEach((c, i) => { place(c, -9.5 + i * 1.6 + Math.sin(t * 0.7 + i) * 0.4, 7.5 + i * 0.6, face(1, -0.6)); if (t < 13) run(c, t + i, 3, 0.3); });
  // opponent with the ball
  const rx = rakipX(t);
  if (t < 12.6) {
    place(rakip, rx, 0, Math.PI / 2); run(rakip, t, t < 9.4 ? 11 : 16);
    if (t > 8.75 && t < 9.4) { const k = seg(t, 8.75, 9.4); rakip.root.position.y = Math.sin(k * Math.PI) * 1.6; rakip.legL.rotation.x = -1.2; rakip.legR.rotation.x = 0.6; rakip.armL.rotation.z = 1.4; rakip.armR.rotation.z = -1.4; }
    ball.position.set(rx + 0.55, 0.23 + (t > 8.75 && t < 9.4 ? Math.sin(seg(t, 8.75, 9.4) * Math.PI) * 1.2 : 0), 0); ball.rotation.z = -rx * 3;
  } else {
    // GOAL: ball in the net, opponent celebrating with a knee slide... a normal one
    place(rakip, 11.5, 0.5, -Math.PI / 2); rakip.armL.rotation.z = 2.6; rakip.armR.rotation.z = -2.6; rakip.setFace('happy');
    rakip.root.position.y = Math.abs(Math.sin(t * 8)) * 0.4;
    ball.position.set(15.1, 0.23, 0.4);
  }
  if (t > 12.1 && t < 12.6) { const k = seg(t, 12.1, 12.6); ball.position.set(lerp(rx + 0.55, 15.1, k), 0.23 + Math.sin(k * Math.PI) * 1.2, lerp(0, 0.4, k)); }
  if (t > 12.3 && t < 13.2) { keeper.root.rotation.z = -1.2 * seg(t, 12.3, 12.6); keeper.root.position.z = -1.2 * seg(t, 12.3, 12.6); keeper.root.position.y = 0.3; }

  // Abdullah himself
  abd.setFace('happy');
  if (A.mode === 'stand') { place(abd, A.x, A.z, face(0, -1)); abd.root.position.y = Math.abs(Math.sin(t * 5)) * 0.35; abd.armL.rotation.z = 0.5 + Math.sin(t * 10) * 0.3; abd.armR.rotation.z = -0.5 - Math.sin(t * 10) * 0.3; }
  else if (A.mode === 'run') { place(abd, A.x, A.z, face(0, -1)); run(abd, t, 14); abd.setFace('cool'); }
  else if (A.mode === 'slide') {
    place(abd, A.x, A.z, face(0.06, -1)); abd.root.position.y = 0.32;
    abd.root.rotation.x = -lerp(0.3, 1.25, ease(A.k * 6));
    abd.legL.rotation.x = -0.7; abd.legR.rotation.x = -0.1; abd.armL.rotation.x = -2.6 + Math.sin(t * 20) * 0.3; abd.armR.rotation.x = -2.2; abd.armR.rotation.z = -0.5;
    abd.setFace(t < 9.0 ? 'cool' : 'shock');
  } else {
    place(abd, A.x, A.z, face(0.06, -1)); abd.root.position.y = 0.3; abd.root.rotation.x = -Math.PI / 2 + 0.05;
    abd.armL.rotation.z = 1.4; abd.armR.rotation.z = -1.4; abd.setFace('shock');
  }

  // ---------------- balloons ----------------
  const anchor = hip(abd);
  const yaw = abd.root.rotation.y, fwd = V(Math.sin(yaw), 0, Math.cos(yaw)), side = V(Math.cos(yaw), 0, -Math.sin(yaw));
  const drag = A.mode === 'slide' ? ease(seg(t, 7.9, 8.5)) : (A.mode === 'lying' ? 1 : 0);
  balloons.forEach((b, i) => {
    const off = i - 2;
    const sway = V(Math.sin(t * 2 + i) * 0.25, Math.sin(t * 3 + i * 2) * 0.12, Math.cos(t * 1.7 + i) * 0.2);
    const floatPos = anchor.clone().add(fwd.clone().multiplyScalar(-0.6)).add(side.clone().multiplyScalar(off * 0.55)).add(V(0, 2.0 + Math.abs(off) * -0.15 + (i % 2) * 0.35, 0)).add(sway);
    const dragPos = anchor.clone().add(fwd.clone().multiplyScalar(-1.3 - (i % 3) * 0.45)).add(side.clone().multiplyScalar(off * 0.6)); dragPos.y = 0.42;
    // while dragged, they wobble and squash against the grass
    const wob = drag * Math.sin(t * 60 + i * 2) * 0.05;
    const pos = floatPos.lerp(dragPos, drag); pos.y += wob;
    const popped = t >= POP[i];
    b.g.visible = !popped; b.g.position.copy(pos);
    b.body.scale.set(1 + drag * 0.15 + wob, 1 - drag * 0.2 - wob, 1 + drag * 0.15);
    b.g.rotation.z = Math.sin(t * 1.5 + i) * 0.15 + drag * Math.sin(t * 50 + i) * 0.15;
    // string: anchor → knot (after the pop it just lies limp on the ground)
    const end = popped ? anchor.clone().add(fwd.clone().multiplyScalar(-0.7)).add(side.clone().multiplyScalar(off * 0.3)).setY(0.03) : pos.clone().add(V(0, -0.55, 0));
    const arr = b.line.geometry.attributes.position.array; arr[0] = anchor.x; arr[1] = anchor.y; arr[2] = anchor.z; arr[3] = end.x; arr[4] = end.y; arr[5] = end.z;
    b.line.geometry.attributes.position.needsUpdate = true;
    b.line.visible = t < 23.5;
    b.shards.forEach(s => {
      const lt = t - POP[i]; s.visible = popped && lt < 1.6;
      if (s.visible) { const v = s.userData.v; s.position.set(pos.x + v.x * lt, Math.max(0.03, pos.y + v.y * lt - 6 * lt * lt), pos.z + v.z * lt); s.rotation.set(lt * s.userData.sp, lt * s.userData.sp * 0.6, 0); }
    });
    // the pop position must not depend on later motion: freeze it at pop time
    if (popped) { const a2 = abdState(POP[i]); b.shards.forEach(s => { if (s.visible) { s.position.x += a2.x - A.x; s.position.z += a2.z - A.z; } }); }
    // sparks while scraping
    if (drag > 0.5 && !popped && A.mode === 'slide') {
      for (let k = 0; k < 8; k++) { const s = sparks[i * 8 + k]; const r = rng(Math.floor(t * 30) * 13 + i * 7 + k); s.visible = true;
        s.position.set(pos.x + (r() - 0.5) * 0.8, 0.05 + r() * 0.5, pos.z + 0.3 + r() * 0.6); }
    }
  });
  if (A.mode === 'slide') dust.forEach((d, k) => { const r = rng(k * 31 + 5); const lag = r() * 0.8; const tp = abdState(Math.max(7.6, t - lag)); d.visible = t - lag > 7.6;
    d.position.set(tp.x + (r() - 0.5) * 1.2, 0.15 + lag * 0.8, tp.z + (r() - 0.5) * 0.8 + 0.4); d.scale.setScalar(0.5 + lag * 1.5); d.material.opacity = 0.7 * (1 - lag / 0.8); });

  // ================= SCENES =================
  // A. 0–3.6 the birthday boy
  if (t < 3.6) {
    camera.position.set(lerp(-0.5, -3.2, t / 3.6), 2.3, 1.5); camera.lookAt(-2, 2.2, 6.5);
    cap('top', "ABDULLAH'IN DOĞUM GÜNÜ MAÇI 🎈", 1 + Math.sin(t * 7) * 0.03, 0, '#ffe14d');
    cap('bot', t < 1.8 ? '5 tane balonla geldi' : '(neden? bilmiyoruz.)');
  }
  // B. 3.6–7.6 the opponent attacks, Abdullah gets an idea
  else if (t < 7.6) {
    if (t < 5.6) {
      camera.position.set(rx - 3, 2.2, 5); camera.lookAt(rx + 1, 1, 0);
      cap('top', 'RAKİP ATAĞA KALKTI', 1, 0, '#ff6b6b'); cap('bot', 'kale bomboş 😱');
    } else {
      camera.position.set(-3.5, 2.4, 9.5); camera.lookAt(-2, 1.8, 5.5);
      abd.setFace('cool');
      bubble('BEN HALLEDERİM 😎', V(-2, 3.0, A.z)); cap('top', 'abdullah:');
    }
  }
  // C. 7.6–9.1 slow-mo slide
  else if (t < 9.1) {
    $('slowmo').style.display = 'block'; filter = 'saturate(1.3) contrast(1.1)';
    camera.position.set(A.x + 4.2, 1.0, A.z - 1.2); camera.lookAt(A.x, 0.7, A.z + 0.4); camera.fov = 50;
    cap('top', 'KAYAR ATLADI 🦵', 1.05, -3, '#7dffb0');
    cap('bot', t < 8.4 ? 'efsane an...' : 'ama balonlar... 😳');
  }
  // D. 9.1–10.8 the balloons scrape the grass and pop one by one
  else if (t < 10.8) {
    $('slowmo').style.display = 'block';
    camera.position.set(A.x + 2.6, 0.9, A.z + 3.2); camera.lookAt(A.x - 0.1, 0.4, A.z + 1.2); camera.fov = 58;
    const n = POP.filter(p => t >= p).length;
    cap('top', n === 0 ? '*gıcırrr gıcırrr*' : '', 1 + Math.sin(t * 40) * 0.05, Math.sin(t * 30) * 3, '#fff');
    for (let i = 0; i < n; i++) { const lt = t - POP[i]; const r = rng(i * 17 + 3);
      pat(i, 'PAT!', 120 + r() * 880, 120 + r() * 340, (1.3 - Math.min(lt * 2, 0.4)) * (i === 4 ? 1.5 : 1), (r() - 0.5) * 40); }
    const lastPop = Math.max(...POP.filter(p => t >= p), -9);
    flash('#fff', Math.max(0, 0.65 - (t - lastPop) * 5)); shake = Math.max(0, 0.15 - (t - lastPop) * 0.6);
    cap('bot', n >= 5 ? 'BALONLARIN HEPSİ GİTTİ' : `kalan balon: ${5 - n}`, 1, 0, n >= 5 ? '#ff6b6b' : '#fff');
  }
  // E. 10.8–13 meanwhile... GOAL
  else if (t < 13) {
    camera.position.set(-6.5, 3.3, 3.5); camera.lookAt(5, 0.8, -1.2);
    cap('top', t < 12.4 ? 'bu sırada rakip:' : 'GOOOOOL 🥅', t < 12.4 ? 1 : 1.15 + Math.sin(t * 30) * 0.05, 0, t < 12.4 ? '#fff' : '#ff6b6b');
    cap('bot', 'abdullah hâlâ yerde 🧍‍♂️➡️🛌');
    if (t > 12.4) cheer(0.5);
  }
  // F. 13–19.5 Abdullah is devastated
  else if (t < 19.5) {
    const lt = t - 13;
    filter = 'saturate(0.35) brightness(0.85) contrast(1.1)';
    scene.background.copy(SKY).lerp(new THREE.Color(0x55606e), ease(lt));
    scene.fog.color.copy(scene.background);
    // sitting on the grass, head down, holding the empty strings
    place(abd, -1.4, -3.5, face(0.6, 1)); abd.root.rotation.x = 0; abd.root.position.y = -0.38;
    abd.legL.rotation.x = -Math.PI / 2; abd.legR.rotation.x = -Math.PI / 2 + 0.2;
    abd.armL.rotation.x = -0.9; abd.armR.rotation.x = -0.6; abd.headPivot.rotation.x = 0.35 + Math.sin(t * 9) * 0.04;
    abd.setFace('cry');
    rainCloud.visible = true; rainCloud.position.set(-1.4, 4.4, -3.5);
    drops.forEach(d => { d.visible = true; const y = 4.0 - ((t * 6 + d.userData.o * 4) % 4); d.position.set(-1.4 + d.userData.x, y, -3.5 + d.userData.z); });
    const hp = abd.head.getWorldPosition(V(0, 0, 0));
    tears.forEach((d, k) => { d.visible = true; const ph = ((t * 1.6 + k / 6) % 1); const sdx = k % 2 ? 0.25 : -0.25;
      d.position.set(hp.x + sdx + Math.sin(yaw) * 0.42, hp.y - 0.05 - ph * 1.2, hp.z + Math.cos(abd.root.rotation.y) * 0.42 + ph * 0.3); });
    camera.position.set(-1.4 + 3.4 * Math.sin(0.6) - lt * 0.12, 1.6 + lt * 0.05, -3.5 + 3.4 * Math.cos(0.6) - lt * 0.12); camera.lookAt(-1.4, 1.1, -3.5);
    cap('top', lt < 2 ? 'abdullah çok üzüldü 😢' : (lt < 4.6 ? 'doğum günüydü bugün...' : 'RIP BALONLAR 🎈🕊️'), 1, 0, '#cfe6ff');
    if (lt > 1.2 && lt < 3.9) bubble('balonlarım... 🎈💔', hp.clone().add(V(0, 0.8, 0)));
    if (lt > 4.6) cap('bot', '(2026 – 2026)');
  }
  // G. 19.5–23.5 balloon funeral
  else if (t < 23.5) {
    const lt = t - 19.5;
    filter = 'saturate(0.7)';
    scene.background.copy(new THREE.Color(0x55606e)); scene.fog.color.copy(scene.background);
    const cx = lerp(-6, 2, lt / 4), cz = 4;
    const sway = Math.sin(t * 6) * 0.25;
    coffin.visible = true; coffin.position.set(cx, 2.6 + Math.abs(Math.sin(t * 6)) * 0.12, cz); coffin.rotation.set(0, 0, sway * 0.2);
    const bearers = [team[0], team[1], team[2], keeper];
    bearers.forEach((c, i) => { place(c, cx + (i < 2 ? -0.55 : 0.55), cz + (i % 2 ? 0.55 : -0.55), Math.PI / 2);
      c.root.position.y = Math.abs(Math.sin(t * 6)) * 0.15; c.root.position.z += sway * 0.4;
      c.armL.rotation.x = Math.PI; c.armR.rotation.x = Math.PI; c.legL.rotation.x = Math.sin(t * 6) * 0.4; c.legR.rotation.x = -Math.sin(t * 6) * 0.4; c.setFace('stone'); });
    place(abd, cx - 2.2, cz, Math.PI / 2); run(abd, t, 4, 0.3); abd.setFace('cry'); abd.headPivot.rotation.x = 0.3;
    rainCloud.visible = true; rainCloud.position.set(cx - 2.2, 4.6, cz);
    drops.forEach(d => { d.visible = true; const y = 4.2 - ((t * 6 + d.userData.o * 4) % 4); d.position.set(cx - 2.2 + d.userData.x, y, cz + d.userData.z); });
    place(rakip, cx + 2.6, cz - 1.6, -Math.PI / 2 + 0.5); rakip.headPivot.rotation.x = 0.4; rakip.setFace('stone');
    ball.visible = false;
    camera.position.set(cx - 0.2, 3.6, cz + 6.2); camera.lookAt(cx - 0.8, 2.0, cz);
    cap('top', 'balonların cenazesi ⚰️', 1); cap('bot', lt < 2 ? '(rakip bile geldi)' : 'herkes çok üzgün');
  }
  // H. 23.5–26 red card
  else if (t < 26) {
    const lt = t - 23.5;
    ball.visible = false;
    place(abd, 0, 2, face(0.7, 1)); abd.setFace(lt < 0.6 ? 'cry' : 'shock'); abd.head.scale.setScalar(lt > 0.6 ? 1.15 : 1);
    place(hakem, lerp(5, 1.6, ease(seg(t, 23.5, 24.1))), 2, face(-1, 0)); if (lt < 0.6) run(hakem, t, 14);
    hakem.setFace('stone'); redCard.visible = lt > 0.6; hakem.armR.rotation.x = lt > 0.6 ? Math.PI : 0;
    team.forEach((c, i) => place(c, -4 - i * 1.2, 0.5 - i, face(1, 0.5)));
    camera.position.set(0.8, 2.3, 7.5); camera.lookAt(0.8, 1.8, 2);
    if (lt > 0.6 && lt < 0.8) flash('#f00', 0.5);
    cap('top', lt < 0.6 ? '*düdük*' : 'KIRMIZI KART 🟥', lt > 0.6 ? 1.1 : 1, 0, lt < 0.6 ? '#fff' : '#ff4040');
    if (lt > 0.9) cap('bot', 'sebep: balonla kayar atmak');
  }
  // I. 26–29.5 a balloon comes back... and pops
  else {
    const lt = t - 26;
    ball.visible = false;
    place(abd, 0, 2, face(0.4, 1)); abd.root.position.y = lt > 1.0 && lt < 2.1 ? Math.abs(Math.sin(t * 8)) * 0.3 : 0;
    const hatTip = V(0, 3.15, 2.0);
    const bk = ease(seg(t, 26, 28.0));
    lastBalloon.visible = t < 28.1;
    lastBalloon.position.set(lerp(-3, 0, bk) + Math.sin(t * 2) * 0.3 * (1 - bk), lerp(9, hatTip.y + 0.45, bk), 2);
    lastBalloon.rotation.z = Math.sin(t * 2) * 0.2;
    camera.position.set(0.4, 2.6, 7.2); camera.lookAt(0, 3.2, 2);
    if (t < 28.1) {
      abd.setFace(lt < 0.6 ? 'cry' : 'happy');
      abd.armL.rotation.z = lt > 1 ? 2.6 : 0; abd.armR.rotation.z = lt > 1 ? -2.6 : 0;
      cap('top', lt < 0.6 ? '...' : 'BİR BALON GERİ DÖNDÜ!! 🎈', 1 + Math.sin(t * 8) * 0.04, 0, '#ffe14d');
      if (lt > 1.2) cap('bot', 'abdullah: 🥹');
    } else {
      const pt = t - 28.1;
      abd.setFace(pt < 0.4 ? 'shock' : 'cry'); abd.head.scale.setScalar(pt < 0.4 ? 1.2 : 1);
      lastShards.forEach(s => { s.visible = pt < 1.4; const v = s.userData.v; s.position.set(v.x * pt, hatTip.y + 0.45 + v.y * pt - 6 * pt * pt, 2 + v.z * pt); s.rotation.set(pt * s.userData.sp, pt * s.userData.sp, 0); });
      flash('#fff', Math.max(0, 0.8 - pt * 4)); shake = Math.max(0, 0.12 - pt * 0.3);
      pat(5, 'PAT.', 500, 150, 1.4 - Math.min(pt, 0.3), -8);
      cap('top', ''); cap('bot', pt < 0.6 ? 'parti şapkasına değdi' : '😭😭😭  SON  😭😭😭', 1, 0, '#ff8a8a');
    }
  }

  if (shake > 0) { const r = rng(Math.floor(t * 60) + 1); camera.position.x += (r() - 0.5) * shake * 2; camera.position.y += (r() - 0.5) * shake * 2; }
  camera.updateProjectionMatrix();
  glCanvas.style.filter = filter;
  renderer.render(scene, camera);
}
window.renderAt = renderAt; window.DURATION = DURATION;
const still = new URLSearchParams(location.search).get('still');
if (!navigator.webdriver) {
  if (still !== null) renderAt(parseFloat(still));
  else { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
}
</script>
</body>
