<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Jenny Mod Dehşet Anlar</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  canvas#gl { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .cap {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: "DejaVu Sans", sans-serif; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 4px 4px 0 #000; letter-spacing: 1px; white-space: pre-line;
    transform-origin: 50% 50%;
  }
  #top { top: 28px; font-size: 64px; }
  #bot { bottom: 34px; font-size: 52px; }
  #bubble {
    position: absolute; background: #fff; color: #111; border: 5px solid #000;
    border-radius: 18px; padding: 14px 22px; font: 800 38px "DejaVu Sans", sans-serif;
    white-space: pre-line; text-align: center; display: none;
  }
  #bubble:after {
    content: ""; position: absolute; left: 50%; bottom: -26px; margin-left: -14px;
    border: 14px solid transparent; border-top-color: #000;
  }
  #flash { position: absolute; inset: 0; pointer-events: none; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(120,0,0,0.85) 100%); opacity: 0; }
  #bars { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    border-top: 80px solid #000; border-bottom: 80px solid #000; box-sizing: border-box; }
  #emoji { position: absolute; font: 900 120px "DejaVu Sans", sans-serif; color: #fff;
    -webkit-text-stroke: 4px #000; paint-order: stroke fill; display: none; }
  #wm { position: absolute; right: 14px; top: 10px; font: 700 18px "DejaVu Sans Mono", monospace;
    color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <div id="vig"></div>
  <div id="bars"></div>
  <div id="bubble"></div>
  <div id="emoji"></div>
  <div class="cap" id="top"></div>
  <div class="cap" id="bot"></div>
  <div id="flash"></div>
  <div id="wm">REC ● 21:00</div>
</div>
<script src="three.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// Deterministic helpers
// ---------------------------------------------------------------------------
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1280, 720, false);
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const SKY = new THREE.Color(0x7ec8ff);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(0x7ec8ff, 30, 70);
const camera = new THREE.PerspectiveCamera(55, 1280 / 720, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x447733, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10, 20, 8);
scene.add(sun);

// Pixel textures drawn on tiny canvases (nearest filtering = blocky look)
function pixTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noiseFill(g, w, h, base, vary, seed) {
  const r = rng(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = (r() - 0.5) * vary;
    const c = base.map(ch => clamp(Math.round(ch + v), 0, 255));
    g.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(x, y, 1, 1);
  }
}
const grassTop = pixTex(16, 16, (g, w, h) => noiseFill(g, w, h, [96, 168, 64], 40, 1));
const dirt = pixTex(16, 16, (g, w, h) => noiseFill(g, w, h, [134, 96, 67], 40, 2));
const grassSide = pixTex(16, 16, (g, w, h) => {
  noiseFill(g, w, h, [134, 96, 67], 40, 3);
  const r = rng(4);
  for (let x = 0; x < w; x++) { const d = 3 + Math.floor(r() * 3); g.fillStyle = '#5fa63f'; g.fillRect(x, 0, 1, d); }
});
const logTex = pixTex(16, 16, (g, w, h) => { noiseFill(g, w, h, [104, 82, 50], 30, 5); for (let x = 0; x < w; x += 4) { g.fillStyle = '#4e3b22'; g.fillRect(x, 0, 1, h); } });
const leafTex = pixTex(16, 16, (g, w, h) => noiseFill(g, w, h, [56, 130, 40], 70, 6));
const tntSide = pixTex(16, 16, (g) => {
  g.fillStyle = '#d23a2a'; g.fillRect(0, 0, 16, 16);
  g.fillStyle = '#9b2318'; for (let x = 1; x < 16; x += 3) g.fillRect(x, 0, 1, 16);
  g.fillStyle = '#eee'; g.fillRect(0, 5, 16, 6);
  g.fillStyle = '#111'; g.font = 'bold 6px monospace'; g.fillText('BUM', 2, 10);
});
const tntTop = pixTex(16, 16, (g) => { g.fillStyle = '#c33'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#222'; g.fillRect(6, 6, 4, 4); });

const grassMat = [grassSide, grassSide, grassTop, dirt, grassSide, grassSide].map(m => new THREE.MeshLambertMaterial({ map: m }));
const box1 = new THREE.BoxGeometry(1, 1, 1);

// Ground: one instanced mesh per material is overkill; just a grid of meshes merged by instancing
const N = 21;
const ground = new THREE.InstancedMesh(box1, grassMat, N * N);
{
  const m = new THREE.Matrix4(); let i = 0; const r = rng(9);
  for (let x = 0; x < N; x++) for (let z = 0; z < N; z++) {
    const hgt = (Math.abs(x - 10) > 6 || Math.abs(z - 10) > 6) && r() < 0.25 ? 0 : -1;
    m.makeTranslation(x - 10, hgt - 0.5, z - 10); ground.setMatrixAt(i++, m);
  }
}
scene.add(ground);

function tree(x, z, hgt) {
  const g = new THREE.Group();
  const logM = new THREE.MeshLambertMaterial({ map: logTex });
  const leafM = new THREE.MeshLambertMaterial({ map: leafTex });
  for (let y = 0; y < hgt; y++) { const b = new THREE.Mesh(box1, logM); b.position.set(0, y + 0.5 - 1, 0); g.add(b); }
  for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) for (let dy = 0; dy < 2; dy++) {
    if (Math.abs(dx) === 2 && Math.abs(dz) === 2) continue;
    const b = new THREE.Mesh(box1, leafM); b.position.set(dx, hgt - 1.5 + dy, dz); g.add(b);
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 3), leafM); top.position.set(0, hgt + 0.5, 0); g.add(top);
  g.position.set(x, 0, z); scene.add(g); return g;
}
tree(-7, -6, 5); tree(6, -8, 6); tree(8, 4, 5); tree(-8, 5, 4);

// Clouds
const clouds = [];
{ const cm = new THREE.MeshBasicMaterial({ color: 0xffffff }); const r = rng(77);
  for (let i = 0; i < 8; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(4 + r() * 5, 1, 2 + r() * 3), cm);
    c.position.set(-30 + r() * 60, 18 + r() * 4, -25 + r() * 20); scene.add(c); clouds.push(c); } }

// ---------------------------------------------------------------------------
// Blocky characters (original design: square heads, chunky shirts)
// ---------------------------------------------------------------------------
function faceTex(skin, eyeColor, mode) {
  return pixTex(8, 8, (g) => {
    g.fillStyle = skin; g.fillRect(0, 0, 8, 8);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, 0, 8, 2);
    if (mode === 'normal') {
      g.fillStyle = '#fff'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1);
      g.fillStyle = eyeColor; g.fillRect(2, 3, 1, 1); g.fillRect(5, 3, 1, 1);
      g.fillStyle = '#5a2a1a'; g.fillRect(3, 6, 2, 1);
    } else if (mode === 'shock') {
      g.fillStyle = '#fff'; g.fillRect(1, 2, 2, 3); g.fillRect(5, 2, 2, 3);
      g.fillStyle = '#000'; g.fillRect(2, 3, 1, 1); g.fillRect(5, 3, 1, 1);
      g.fillStyle = '#300'; g.fillRect(3, 5, 2, 3);
    } else if (mode === 'smirk') {
      g.fillStyle = '#fff'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1);
      g.fillStyle = eyeColor; g.fillRect(2, 3, 1, 1); g.fillRect(6, 3, 1, 1);
      g.fillStyle = '#000'; g.fillRect(1, 2, 2, 1);
      g.fillStyle = '#5a2a1a'; g.fillRect(4, 6, 3, 1); g.fillRect(6, 5, 1, 1);
    } else if (mode === 'stone') { // the "moai" stare
      g.fillStyle = '#000'; g.fillRect(1, 2, 6, 1);
      g.fillStyle = '#222'; g.fillRect(1, 3, 2, 1); g.fillRect(5, 3, 2, 1);
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(3, 3, 2, 3);
      g.fillStyle = '#3a1a10'; g.fillRect(2, 6, 4, 1);
    }
  });
}

function makeChar(opts) {
  const root = new THREE.Group();
  const skinM = new THREE.MeshLambertMaterial({ color: opts.skin });
  const hairM = new THREE.MeshLambertMaterial({ color: opts.hair });
  const shirtM = new THREE.MeshLambertMaterial({ color: opts.shirt });
  const pantsM = new THREE.MeshLambertMaterial({ color: opts.pants });
  const faces = {};
  ['normal', 'shock', 'smirk', 'stone'].forEach(k => faces[k] = new THREE.MeshLambertMaterial({ map: faceTex(opts.skin, opts.eye, k) }));
  // head: +z face is the front
  const headMats = [hairM, hairM, hairM, skinM, faces.normal, hairM];
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMats);
  const headPivot = new THREE.Group(); headPivot.position.y = 1.5; head.position.y = 0.4; headPivot.add(head);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), shirtM); body.position.y = 1.05;
  function limb(mat, w, h, x, y) { const p = new THREE.Group(); p.position.set(x, y, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.y = -h / 2; p.add(m); return p; }
  const armL = limb(shirtM, 0.3, 0.85, -0.55, 1.48), armR = limb(shirtM, 0.3, 0.85, 0.55, 1.48);
  // hands
  [armL, armR].forEach(a => { const h = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.3), skinM); h.position.y = -0.85; a.add(h); });
  const legL = limb(pantsM, 0.38, 0.6, -0.2, 0.6), legR = limb(pantsM, 0.38, 0.6, 0.2, 0.6);
  // sunglasses
  const glasses = new THREE.Group();
  const gm = new THREE.MeshBasicMaterial({ color: 0x050505 });
  const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.05), gm); l1.position.set(-0.2, 0, 0);
  const l2 = l1.clone(); l2.position.x = 0.2;
  const br = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.05), gm); br.position.y = 0.05;
  const shine = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.02), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  shine.position.set(-0.27, 0.03, 0.03);
  glasses.add(l1, l2, br, shine); glasses.position.set(0, 0.47 - 0.4 + 0.4 - 0.02, 0.43); glasses.position.y = 0.43; head.add(glasses);
  glasses.visible = false;
  root.add(headPivot, body, armL, armR, legL, legR);
  scene.add(root);
  return { root, head, headPivot, body, armL, armR, legL, legR, glasses, faces, headMats,
    setFace(k) { headMats[4] = faces[k]; head.material = headMats; } };
}

const chars = {
  aga:   makeChar({ skin: '#e0ac7e', hair: '#3b2412', shirt: '#2f7de1', pants: '#2b2b6b', eye: '#2b5bd7' }),
  kanka: makeChar({ skin: '#c98d5e', hair: '#111111', shirt: '#e23b3b', pants: '#333333', eye: '#4a2a10' }),
  modcu: makeChar({ skin: '#f0c49a', hair: '#d9a520', shirt: '#38b34a', pants: '#5a4630', eye: '#1b8c3a' }),
  sigma: makeChar({ skin: '#d29a6b', hair: '#1b1b1b', shirt: '#151515', pants: '#101010', eye: '#222' }),
};
const HOME = { aga: [-3, 0, 0], kanka: [-1, 0, 1], modcu: [1.2, 0, 1], sigma: [3.2, 0, 0] };

// TNT
const tnt = new THREE.Mesh(box1, [tntSide, tntSide, tntTop, tntTop, tntSide, tntSide].map(m => new THREE.MeshLambertMaterial({ map: m, emissive: 0xffffff, emissiveIntensity: 0 })));
scene.add(tnt);

// Debris particles for explosion
const debris = []; {
  const r = rng(123);
  const mats = [new THREE.MeshLambertMaterial({ map: dirt }), new THREE.MeshLambertMaterial({ map: grassTop }), new THREE.MeshBasicMaterial({ color: 0xffaa22 }), new THREE.MeshBasicMaterial({ color: 0x444444 })];
  for (let i = 0; i < 60; i++) {
    const s = 0.15 + r() * 0.35;
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mats[i % 4]);
    m.userData = { v: new THREE.Vector3((r() - 0.5) * 14, 4 + r() * 10, (r() - 0.5) * 14), spin: (r() - 0.5) * 20 };
    m.visible = false; scene.add(m); debris.push(m);
  }
}
// Stars for the "flew to space" ending
const starGeo = new THREE.BufferGeometry(); {
  const r = rng(55); const p = [];
  for (let i = 0; i < 400; i++) p.push((r() - 0.5) * 120, 20 + r() * 60, -40 - r() * 30);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0 }));
scene.add(stars);

// ---------------------------------------------------------------------------
// DOM overlay helpers
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function cap(id, text, scale = 1, rot = 0, color = '#fff') {
  const el = $(id); el.textContent = text || ''; el.style.transform = `scale(${scale}) rotate(${rot}deg)`; el.style.color = color;
}
function bubble(text, worldPos) {
  const el = $('bubble');
  if (!text) { el.style.display = 'none'; return; }
  el.style.display = 'block'; el.textContent = text;
  const p = worldPos.clone().project(camera);
  const x = (p.x * 0.5 + 0.5) * 1280, y = (-p.y * 0.5 + 0.5) * 720;
  el.style.left = (x - el.offsetWidth / 2) + 'px'; el.style.top = Math.max(110, y - el.offsetHeight - 30) + 'px';
}
function flash(color, a) { $('flash').style.background = color; $('flash').style.opacity = a; }

// ---------------------------------------------------------------------------
// Timeline
// ---------------------------------------------------------------------------
const DURATION = 25;
function resetChars() {
  for (const k in chars) {
    const c = chars[k], h = HOME[k];
    c.root.position.set(h[0], h[1], h[2]); c.root.rotation.set(0, 0, 0); c.root.scale.set(1, 1, 1);
    c.headPivot.rotation.set(0, 0, 0); c.head.scale.set(1, 1, 1);
    c.armL.rotation.set(0, 0, 0); c.armR.rotation.set(0, 0, 0); c.legL.rotation.set(0, 0, 0); c.legR.rotation.set(0, 0, 0);
    c.glasses.visible = false; c.setFace('normal'); c.root.visible = true;
  }
}
function idle(c, t, phase, amp = 1) {
  const s = Math.sin(t * 6 + phase);
  c.armL.rotation.x = s * 0.4 * amp; c.armR.rotation.x = -s * 0.4 * amp;
  c.legL.rotation.x = -s * 0.3 * amp; c.legR.rotation.x = s * 0.3 * amp;
}
function hop(c, t, phase, h = 0.6) { c.root.position.y = Math.abs(Math.sin(t * 5 + phase)) * h; }

function renderAt(t) {
  resetChars();
  const { aga, kanka, modcu, sigma } = chars;
  let filter = 'none';
  let shake = 0;
  cap('top', ''); cap('bot', ''); bubble(null); flash('#fff', 0);
  $('vig').style.opacity = 0; $('bars').style.opacity = 0; $('emoji').style.display = 'none';
  scene.background.copy(SKY); scene.fog.color.copy(SKY);
  stars.material.opacity = 0;
  tnt.visible = false; tnt.material.forEach(m => m.emissiveIntensity = 0);
  debris.forEach(d => d.visible = false);
  clouds.forEach((c, i) => c.position.x = ((c.position.x + 30 + 0.02) % 60) - 30 + 0 * i);
  camera.fov = 55; camera.up.set(0, 1, 0);

  // ---- 0 – 4s : intro, everyone hyped --------------------------------------
  if (t < 4) {
    const k = t / 4;
    camera.position.set(lerp(-6, 6, k), 4.5, 11);
    camera.lookAt(0, 1.2, 0);
    Object.values(chars).forEach((c, i) => { hop(c, t, i * 0.8); idle(c, t, i); c.root.rotation.y = Math.sin(t * 2 + i) * 0.3; });
    cap('top', t < 1.8 ? 'BU AKŞAM 4 KİŞİYİZ' : 'MİNECRAFT OYNASAKMI AGA??', 1 + Math.sin(t * 9) * 0.04);
    cap('bot', t < 1.8 ? '(gerçek hikaye)' : 'herkes: EVET KANKA 🔥', 1);
  }
  // ---- 4 – 7.6s : modcu has an "idea" ---------------------------------------
  else if (t < 7.6) {
    const k = ease(seg(t, 4, 5.2));
    camera.position.set(lerp(3, 1.6, k), lerp(3, 2.2, k), lerp(8, 4.2, k));
    camera.lookAt(1.2, 1.7, 1);
    modcu.root.rotation.y = -0.2; modcu.setFace('smirk');
    modcu.armR.rotation.x = -1.2 + Math.sin(t * 3) * 0.1; modcu.armR.rotation.z = 0.3;
    [aga, kanka, sigma].forEach((c, i) => { idle(c, t, i, 0.3); });
    sigma.root.rotation.y = -0.5;
    if (t > 4.6) bubble(t < 6 ? 'kanka...' : 'JENNY MOD\nkuralım mı? 😏', modcu.root.position.clone().add(new THREE.Vector3(0, 2.4, 0)));
    if (t > 6.6) cap('bot', '*sunucu sessizliğe gömüldü*');
  }
  // ---- 7.6 – 8.2s : silence (cricket moment) ---------------------------------
  else if (t < 8.2) {
    camera.position.set(0, 2.5, 9); camera.lookAt(0, 1.3, 0);
    Object.values(chars).forEach(c => c.root.rotation.y = 0);
    [aga, kanka, sigma].forEach(c => c.root.rotation.y = (c.root.position.x < 1 ? 1 : -1) * 0.9);
    cap('top', '...'); filter = 'saturate(0.4)';
  }
  // ---- 8.2 – 12.4s : DEHŞET ANLAR — jumpscare zooms --------------------------
  else if (t < 12.4) {
    const victims = [aga, kanka, sigma, aga];
    const i = Math.min(3, Math.floor((t - 8.2) / 0.9));
    const lt = (t - 8.2) - i * 0.9;
    if (t < 11.8) {
      const v = victims[i];
      v.setFace('shock'); v.head.scale.setScalar(1 + Math.min(lt * 4, 0.7));
      v.headPivot.rotation.z = Math.sin(lt * 50) * 0.15;
      v.root.rotation.y = 0;
      const hp = v.root.position;
      const z = lerp(5, 1.9, ease(lt / 0.15));
      camera.position.set(hp.x + Math.sin(i * 2) * 0.4, 2.0, hp.z + z);
      camera.lookAt(hp.x, 1.95, hp.z);
      camera.fov = lerp(70, 40, ease(lt / 0.2));
      shake = 0.12 * (1 - lt / 0.9);
      $('vig').style.opacity = 0.9;
      filter = `contrast(1.6) saturate(2.2) hue-rotate(${-15 + i * 3}deg)`;
      flash('#f00', lt < 0.08 ? 0.6 : 0);
      cap('top', 'DEHŞET ANLAR', 1.1 + Math.sin(t * 40) * 0.06, Math.sin(t * 23) * 4, '#ff2b2b');
      cap('bot', ['"NE DEDİN SEN"', '"KANKA ŞAKA DİMİ"', '...', 'AGA ÇIKIYORUM'][i], 1.05);
      // everyone else shocked too
      [aga, kanka, sigma].forEach(c => { if (c !== v) c.setFace('shock'); });
    } else {
      // all heads spin 360 in disbelief
      camera.position.set(0, 3, 8); camera.lookAt(0, 1.3, 0.5);
      [aga, kanka, sigma].forEach(c => { c.setFace('shock'); c.headPivot.rotation.y = (t - 11.8) * 18; });
      modcu.setFace('smirk');
      cap('top', 'DEHŞET ANLAR', 1, 0, '#ff2b2b'); filter = 'contrast(1.4) saturate(1.8)';
      $('vig').style.opacity = 0.7;
    }
  }
  // ---- 12.4 – 18.6s : SIGMA moment ------------------------------------------
  else if (t < 18.6) {
    const k = seg(t, 12.4, 18.6);
    filter = 'grayscale(1) contrast(1.35) brightness(0.95)';
    $('bars').style.opacity = 1;
    sigma.glasses.visible = t > 13.4; sigma.setFace('stone');
    // slow walk toward modcu
    const walk = ease(seg(t, 12.6, 15.6));
    sigma.root.position.x = lerp(3.2, 2.1, walk); sigma.root.position.z = lerp(0, 2.6, walk);
    sigma.root.rotation.y = lerp(-0.3, -1.2, walk);
    if (walk < 1) idle(sigma, t * 0.35, 0, 0.6);
    modcu.setFace(t > 16 ? 'shock' : 'smirk'); modcu.root.rotation.y = lerp(0, 1.0, walk);
    [aga, kanka].forEach((c, i) => { c.setFace('stone'); c.root.rotation.y = 0.8; });
    // low-angle hero shot that slowly orbits
    const ang = lerp(-0.9, 0.3, k);
    const tgt = sigma.root.position.clone().add(new THREE.Vector3(0, 1.6, 0));
    camera.position.set(tgt.x + Math.sin(ang) * 3.4, 0.55, tgt.z + Math.cos(ang) * 3.4);
    camera.lookAt(tgt); camera.fov = 50;
    if (t > 13.4 && t < 13.9) shake = 0.05;
    cap('top', t < 14.6 ? 'SIGMA ENTERS THE CHAT 🗿' : 'SIGMA KURAL #1:', 1);
    if (t > 14.6) cap('bot', t < 16.6 ? 'VANİLLA OYNANIR. NOKTA.' : 'mod mu? ben sadece elmas kazarım', 1);
    if (t > 16 && t < 17.6) bubble('HAYIR.', sigma.root.position.clone().add(new THREE.Vector3(0, 2.4, 0)));
    if (t > 17.6) {
      $('emoji').style.display = 'block'; $('emoji').textContent = '🗿';
      $('emoji').style.left = '1040px'; $('emoji').style.top = '420px';
    }
  }
  // ---- 18.6 – 21.6s : TNT + launch ------------------------------------------
  else if (t < 21.6) {
    sigma.glasses.visible = true; sigma.setFace('stone');
    sigma.root.position.set(lerp(2.1, 5.5, seg(t, 18.6, 21.6)), 0, lerp(2.6, 5, seg(t, 18.6, 21.6))); sigma.root.rotation.y = 1.0; idle(sigma, t * 0.5, 0, 0.5); // walks away, doesn't look back
    modcu.setFace('shock');
    tnt.visible = t < 20.2;
    tnt.position.set(modcu.root.position.x, lerp(-1.5, 0.5, ease(seg(t, 18.6, 18.9))), modcu.root.position.z);
    const blink = Math.floor(t * 8) % 2;
    tnt.material.forEach(m => m.emissiveIntensity = t > 19 ? blink * 0.8 : 0);
    tnt.scale.setScalar(t > 19.6 ? 1 + (t - 19.6) * 0.5 : 1);
    if (t < 20.2) {
      modcu.root.position.y = 1;
      modcu.armL.rotation.z = 2.5; modcu.armR.rotation.z = -2.5;
      camera.position.set(-2.5, 2.6, 7); camera.lookAt(1.2, 1.2, 1);
      cap('top', '*tısssss*', 1 + blink * 0.1, 0, '#ffef5a');
      cap('bot', 'modcu: "dur kanka şaka yaptım"');
      [aga, kanka].forEach(c => { c.setFace('stone'); c.root.rotation.y = 0.9; });
    } else {
      const lt = t - 20.2;
      flash('#fff', Math.max(0, 1 - lt * 3));
      shake = Math.max(0, 0.4 - lt * 0.4);
      debris.forEach(d => { d.visible = true; const v = d.userData.v;
        d.position.set(1.2 + v.x * lt, 0.5 + v.y * lt - 9.8 * lt * lt * 0.5, 1 + v.z * lt);
        d.rotation.set(lt * d.userData.spin, lt * d.userData.spin * 0.7, 0); });
      modcu.root.position.set(1.2 + lt * 2, 1 + lt * 14, 1 - lt * 4);
      modcu.root.rotation.set(lt * 9, lt * 5, lt * 7);
      modcu.armL.rotation.z = 2.6 + Math.sin(lt * 30); modcu.armR.rotation.z = -2.6 - Math.sin(lt * 30);
      camera.position.set(-3, 2, 9); camera.lookAt(modcu.root.position.x * 0.5, modcu.root.position.y * 0.6 + 1, 0);
      cap('top', 'BUUUUM', 1.3 - Math.min(lt, 0.3), Math.sin(t * 30) * 5, '#ffb000');
      cap('bot', 'MODCU SUNUCUDAN ATILDI', 1);
      [aga, kanka].forEach((c, i) => { c.setFace('shock'); hop(c, t, i, 0.3); });
    }
  }
  // ---- 21.6 – 25s : outro ---------------------------------------------------
  else {
    const lt = t - 21.6;
    // night falls, modcu is now a star in the sky
    const nk = ease(seg(t, 21.6, 22.6));
    scene.background.copy(SKY).lerp(new THREE.Color(0x0b0b2a), nk); scene.fog.color.copy(scene.background);
    stars.material.opacity = nk;
    modcu.root.position.set(3 + lt * 0.3, 8.5, -8); modcu.root.rotation.set(lt * 2, lt * 3, lt);
    modcu.setFace('shock');
    sigma.glasses.visible = true; sigma.setFace('stone');
    [aga, kanka, sigma].forEach((c, i) => { hop(c, t * 1.4, i * 1.1, 0.7); idle(c, t * 1.5, i, 1.4); c.root.rotation.y = Math.sin(t * 4 + i) * 0.6; });
    sigma.root.position.set(1.5, sigma.root.position.y, 1);
    camera.position.set(0, 3.2, 10 - lt * 0.6); camera.lookAt(0, 3, -2);
    cap('top', '+1000 AURA', 1 + Math.sin(t * 8) * 0.06, 0, '#7dffb0');
    cap('bot', lt < 1.7 ? 'vanilla kazandı 🏆' : 'BU AKŞAM 21:00 GELİN AGA 🎮', 1);
  }

  if (shake > 0) {
    const r = rng(Math.floor(t * 60));
    camera.position.x += (r() - 0.5) * shake * 2; camera.position.y += (r() - 0.5) * shake * 2;
  }
  camera.updateProjectionMatrix();
  glCanvas.style.filter = filter;
  renderer.render(scene, camera);
}
window.renderAt = renderAt;
window.DURATION = DURATION;

// Live preview when opened directly in a browser (?still=SECONDS to freeze)
const still = new URLSearchParams(location.search).get('still');
if (!navigator.webdriver) {
  if (still !== null) renderAt(parseFloat(still));
  else { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
}
</script>
