<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmadan Hayat Dersi</title>
<style>
  :root{ --meme: Impact, "Anton", "Arial Black", "DejaVu Sans", sans-serif; --sig:"DejaVu Sans", sans-serif; --pink:#ff4fa8; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;pointer-events:none}
  #grain{inset:0;width:100%;height:100%;opacity:.06;mix-blend-mode:screen;image-rendering:pixelated}
  #vig{inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 100%)}
  .lb{left:0;right:0;height:6.5cqw;background:#000}
  #lbT{top:0} #lbB{bottom:0}
  #sub{left:6cqw;right:6cqw;bottom:10cqw;text-align:center;font:700 2.9cqw/1.3 var(--sig);letter-spacing:.12em;
    text-shadow:0 0 1.2cqw rgba(0,0,0,.9),0 0 .3cqw #000;opacity:0}
  #sub i{color:var(--pink);font-style:normal}
  #title{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 9.5cqw/1 var(--meme);letter-spacing:.12em;white-space:nowrap;
    color:#fff;text-shadow:0 0 3cqw rgba(255,79,168,.7),0 0 .6cqw #000;opacity:0}
  #small{left:0;right:0;top:63%;text-align:center;font:400 1.9cqw/1.3 var(--sig);letter-spacing:.35em;color:#ddd;opacity:0;text-transform:lowercase}
  #card{left:50%;top:50%;transform:translate(-50%,-50%);padding:2.2cqw 3.4cqw;border:.25cqw solid var(--pink);background:rgba(0,0,0,.65);
    font:700 3cqw/1.35 var(--sig);letter-spacing:.08em;text-align:center;opacity:0;box-shadow:0 0 3cqw rgba(255,79,168,.45)}
  #card b{display:block;font:900 2cqw/1 var(--meme);letter-spacing:.4em;color:var(--pink);margin-bottom:1cqw}
  #timer{right:5cqw;top:8.5cqw;font:700 2.6cqw/1 "DejaVu Sans Mono",monospace;color:#ff4040;opacity:0;text-shadow:0 0 1cqw #f00}
  #flash{inset:0;background:#fff;opacity:0}
  #batt{right:5cqw;top:8.5cqw;padding:.5cqw 1cqw;border:.25cqw solid #ff4040;font:700 2.2cqw/1 "DejaVu Sans Mono",monospace;color:#ff4040;opacity:0;text-shadow:0 0 1cqw #f00}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4cqw;background:rgba(0,0,0,.7);z-index:10;font-family:var(--sig)}
  #ui button{font:900 3cqw/1 var(--meme);padding:1.4cqw 3cqw;border:.3cqw solid var(--pink);cursor:pointer;background:#111;color:#fff;letter-spacing:.1em}
  #ui nav{display:flex;gap:1cqw} #ui nav a{color:#fff;border:.2cqw solid #555;padding:.6cqw 1.2cqw;text-decoration:none;font:700 1.6cqw/1 var(--sig)}
  #ui nav a.on{border-color:var(--pink);color:var(--pink)}
  #ui .hint{font-size:1.5cqw;color:#bbb;letter-spacing:.2em}
  #bar{position:absolute;left:0;bottom:0;height:.4cqw;background:var(--pink);width:0;z-index:5}
  body.render #ui,body.render #bar{display:none}
</style>
</head>

<div id="stage">
  <canvas id="c"></canvas>

  </div>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

const QS = new URLSearchParams(location.search);
const VID = Math.min(4, Math.max(1, parseInt(QS.get('v') || '1', 10) || 1));
const CARD = QS.has('card') ? Math.min(5, Math.max(0, parseInt(QS.get('card'), 10) || 0)) : null; // 0 giriş, 1-4 SENARYO, 5 kapanış
const DUR = CARD === null ? 11 : (CARD === 0 ? 3.4 : CARD === 5 ? 4 : 2.2);
const RENDER_MODE = QS.has('render');
if (RENDER_MODE) document.body.classList.add('render');
const NAMES = ['oyunda toksik', 'sıraya kaçan', 'kendini yıldız sanan', 'zorba'];
document.getElementById('nav').innerHTML = NAMES.map((n, i) => `<a href="?v=${i + 1}" class="${i + 1 === VID && CARD === null ? 'on' : ''}">${i + 1}. ${n}</a>`).join('');


/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const R = rng(11);

function pixTex(w, h, draw, linear = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (!linear) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noisy(g, w, h, base, vary, r = R) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = (r() - .5) * vary;
    g.fillStyle = `rgb(${clamp(base[0] + v, 0, 255)},${clamp(base[1] + v, 0, 255)},${clamp(base[2] + v, 0, 255)})`; g.fillRect(x, y, 1, 1); }
}
const planks = (base) => pixTex(16, 16, (g, w, h) => { noisy(g, w, h, base, 22); g.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1); g.fillRect(7, 0, 1, 4); g.fillRect(2, 4, 1, 4); g.fillRect(11, 8, 1, 4); g.fillRect(5, 12, 1, 4); });
function rep(t, x, y) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; }

/* ---------- sahne ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16 / 9, .05, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#555', 1.1); scene.add(hemi);
const dir = new THREE.DirectionalLight('#fff4e0', 1.2); dir.position.set(5, 10, 6); scene.add(dir);
const pink = new THREE.PointLight('#ff4fa8', 0, 6, 1.5); scene.add(pink);

const L = (m, o = {}) => new THREE.MeshLambertMaterial({ map: m, ...o });
const C = c => new THREE.MeshLambertMaterial({ color: c });
const BOX = new THREE.BoxGeometry(1, 1, 1);
function block(parent, mat, sx, sy, sz, x, y, z) { const m = new THREE.Mesh(BOX, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m; }

/* ---------- monitör ekranları (canlı canvas) ---------- */
const screens = [];
function makeMonitor(parent, x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  block(g, C('#222'), .12, .3, .12, 0, .15, -.05); block(g, C('#222'), .4, .04, .3, 0, .02, -.05);
  block(g, C('#1a1a1a'), 1.0, .64, .08, 0, .6, -.05);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 160;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(.9, .55), new THREE.MeshBasicMaterial({ map: tex }));
  mesh.position.set(0, .6, -.005); g.add(mesh);
  const s = { cv, g: cv.getContext('2d'), tex, key: '', group: g }; screens.push(s); return s;
}
function drawScreen(s, state, p = 0, t = 0, fps = 0) {
  const key = state + '|' + (state === 'jenny' ? Math.floor(t * 8) + '|' + fps : Math.floor(p * 40));
  if (key === s.key) return; s.key = key;
  const g = s.g, W = 256, H = 160; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state === 'off') { g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, W, H); }
  else if (state === 'download') {
    g.fillStyle = '#10182a'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = '700 15px "DejaVu Sans Mono",monospace';
    g.fillText(p < 1 ? 'jenny_mod.jar' : 'jenny_mod.jar', W / 2, 46); g.font = '700 12px "DejaVu Sans Mono",monospace';
    g.fillStyle = '#9fb3d9'; g.fillText(p < 1 ? 'indiriliyor... %' + Math.floor(p * 100) : 'KURULDU ✓', W / 2, 70);
    g.fillStyle = '#333'; g.fillRect(28, 92, 200, 16); g.fillStyle = p < 1 ? '#4caf50' : '#ff4fa8'; g.fillRect(30, 94, 196 * p, 12);
  } else if (state === 'jenny') {
    const f = Math.floor(t * 8);
    g.fillStyle = f % 2 ? '#ff5fb0' : '#ff7cc0'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 18; i++) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(hash(i + f * 31) * W, hash(i * 7 + f) * H, 10, 10); }
    g.fillStyle = '#fff'; g.strokeStyle = '#7a1b4f'; g.lineWidth = 6; g.font = '900 38px Impact,"DejaVu Sans",sans-serif';
    g.strokeText('JENNY MOD', W / 2, 62); g.fillText('JENNY MOD', W / 2, 62);
    g.font = '700 16px "DejaVu Sans Mono",monospace'; g.fillStyle = '#ffe14a'; g.fillText('FPS: ' + fps, W / 2, 104);
    g.fillStyle = '#7a1b4f'; for (let i = 0; i < 8; i++) { g.globalAlpha = ((i + f) % 8) / 8; g.fillRect(W / 2 - 40 + i * 10, 128, 7, 7); } g.globalAlpha = 1;
  }
  else if (state === 'docx') {
    g.fillStyle = '#f4f6fb'; g.fillRect(0, 0, W, H); g.fillStyle = '#2b579a'; g.fillRect(0, 0, W, 22);
    g.fillStyle = '#fff'; g.font = '700 11px "DejaVu Sans",sans-serif'; g.fillText('Matematik_Odevi.docx', W / 2, 12);
    g.fillStyle = '#222'; g.font = '700 13px "DejaVu Serif",serif'; g.fillText('MATEMATİK ÖDEVİ', W / 2, 42);
    g.fillStyle = '#999'; for (let i = 0; i < 6; i++) g.fillRect(28, 60 + i * 14, 200 - (i % 3) * 30, 5);
  }
  s.tex.needsUpdate = true;
}

function faceTex(kind, o) {
  return pixTex(8, 8, g => {
    const P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
    g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8);
    if (!o.bald) { for (let x = 0; x < 8; x++) P(x, 0, o.hair); [0, 7].forEach(x => P(x, 1, o.hair)); } if (o.bangs) for (let x = 0; x < 6; x++) P(x, 1, o.hair);
    const E = o.eye || '#4b3a8c', M = '#4a1e10';
    P(3, 5, o.nose || '#9a6040'); P(4, 5, o.nose || '#9a6040');
    if (kind === 'happy' || kind === 'talk') {
      P(1, 4, '#fff'); P(2, 4, E); P(5, 4, E); P(6, 4, '#fff');
      if (kind === 'happy') { P(1, 6, M); P(6, 6, M); for (let x = 2; x <= 5; x++) P(x, 7, M); for (let x = 2; x <= 5; x++) P(x, 6, '#fff'); }
      else { for (let x = 2; x <= 5; x++) { P(x, 6, M); P(x, 7, M); } P(3, 7, '#c0404a'); P(4, 7, '#c0404a'); }
    } else if (kind === 'sneaky') {
      P(1, 4, E); P(2, 4, E); P(5, 4, E); P(6, 4, E); for (const x of [1, 2, 5, 6]) P(x, 3, o.hair);
      P(2, 6, M); P(3, 6, M); P(4, 6, M); P(5, 6, '#fff'); P(6, 5, M);
    } else if (kind === 'shock') {
      for (const ex of [1, 5]) { P(ex, 3, '#fff'); P(ex + 1, 3, '#fff'); P(ex, 4, '#fff'); P(ex + 1, 4, '#fff'); }
      P(2, 4, '#111'); P(5, 4, '#111'); for (const x of [1, 2, 5, 6]) P(x, 2, o.hair);
      P(3, 6, '#2a0d06'); P(4, 6, '#2a0d06'); P(3, 7, '#2a0d06'); P(4, 7, '#2a0d06');
    } else if (kind === 'angry') {
      P(1, 2, '#111'); P(2, 3, '#111'); P(6, 2, '#111'); P(5, 3, '#111');
      P(1, 4, '#fff'); P(2, 4, '#c00'); P(5, 4, '#c00'); P(6, 4, '#fff');
      for (let x = 2; x <= 5; x++) P(x, 6, M); P(1, 7, M); P(6, 7, M);
    } else if (kind === 'relaxed') {
      for (const x of [1, 2, 5, 6]) P(x, 4, '#3a1d0e'); P(0, 5, '#e8907a'); P(7, 5, '#e8907a');
      P(2, 6, M); P(5, 6, M); P(3, 7, M); P(4, 7, M);
    } else if (kind === 'scared') {
      P(1, 3, '#fff'); P(2, 3, '#111'); P(5, 3, '#111'); P(6, 3, '#fff'); P(2, 2, o.hair); P(5, 2, o.hair);
      for (let y = 4; y < 8; y++) { P(1, y, '#57c7ff'); P(6, y, '#57c7ff'); }
      P(2, 7, M); P(3, 6, M); P(4, 6, M); P(5, 7, M);
    }
    if (o.glasses) { g.fillStyle = '#111'; g.fillRect(0, 4, 8, 1); P(1, 3, '#111'); P(2, 3, '#111'); P(5, 3, '#111'); P(6, 3, '#111'); if (kind !== 'angry') { P(1, 4, '#fff'); P(6, 4, '#fff'); P(2, 4, '#111'); P(5, 4, '#111'); } else { P(2, 4, '#c00'); P(5, 4, '#c00'); } }
    if (o.mustache) { for (let x = 1; x <= 6; x++) P(x, 6, o.mustache); }
    if (o.beard) { for (let x = 0; x < 8; x++) P(x, 7, o.hair); P(0, 6, o.hair); P(7, 6, o.hair); P(0, 5, o.hair); P(7, 5, o.hair); if (kind === 'angry' || kind === 'talk') { P(3, 7, '#2a0d06'); P(4, 7, '#2a0d06'); } }
  });
}
function makeChar(o) {
  const faces = {}; ['happy', 'talk', 'sneaky', 'shock', 'angry', 'scared', 'relaxed'].forEach(k => faces[k] = faceTex(k, o));
  const side = pixTex(8, 8, g => { g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8); g.fillStyle = o.hair; if (o.bald) g.fillRect(0, 2, 3, 2); else { g.fillRect(0, 0, 8, 2); g.fillRect(0, 2, 2, 1); g.fillRect(6, 2, 2, 1); } if (o.beard) g.fillRect(0, 5, 3, 3); if (o.glasses) { g.fillStyle = '#111'; g.fillRect(0, 4, 8, 1); } });
  const hairT = pixTex(8, 8, (g, w, h) => noisy(g, w, h, new THREE.Color(o.bald ? o.skin : o.hair).toArray().map(v => v * 255), 18));
  const faceMat = new THREE.MeshLambertMaterial({ map: faces.happy });
  const root = new THREE.Group(); scene.add(root);
  const body = new THREE.Group(); root.add(body);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.5, .75, .25), C(o.shirt)); torso.position.y = 1.125; body.add(torso);
  if (o.tie) block(body, C(o.tie), .08, .45, .02, 0, 1.25, .13);
  const head = new THREE.Group(); head.position.y = 1.5; body.add(head);
  const hm = new THREE.Mesh(new THREE.BoxGeometry(.5, .5, .5), [L(side), L(side), L(hairT), C(o.skin), faceMat, L(hairT)]); hm.position.y = .25; head.add(hm);
  const mkArm = s => { const g = new THREE.Group(); g.position.set(s * .375, 1.4, 0);
    const sl = new THREE.Mesh(new THREE.BoxGeometry(.25, .35, .25), C(o.shirt)); sl.position.y = -.07; g.add(sl);
    const hd = new THREE.Mesh(new THREE.BoxGeometry(.24, .45, .24), C(o.sleeve || o.skin)); hd.position.y = -.47; g.add(hd); body.add(g); return g; };
  const mkLeg = s => { const g = new THREE.Group(); g.position.set(s * .125, .75, 0);
    const p = new THREE.Mesh(new THREE.BoxGeometry(.25, .6, .25), C(o.pants)); p.position.y = -.3; g.add(p);
    const sh = new THREE.Mesh(new THREE.BoxGeometry(.25, .15, .25), C(o.shoe || '#333')); sh.position.y = -.675; g.add(sh); root.add(g); return g; };
  const c = { root, body, head, faceMat, faces, armL: mkArm(-1), armR: mkArm(1), legL: mkLeg(-1), legR: mkLeg(1) };
  root.scale.setScalar(o.scale || 1);
  c.reset = () => { root.visible = false; root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);
    [head, c.armL, c.armR, c.legL, c.legR].forEach(p => p.rotation.set(0, 0, 0)); c.face('happy'); };
  c.face = k => { c.faceMat.map = faces[k]; };
  c.sit = () => { root.position.y -= .3; c.legL.rotation.x = c.legR.rotation.x = -Math.PI / 2; };
  c.walk = (t, sp = 9, a = .7) => { const s = Math.sin(t * sp); c.legL.rotation.x = s * a; c.legR.rotation.x = -s * a; c.armL.rotation.x = -s * a; c.armR.rotation.x = s * a; body.position.y = Math.abs(Math.cos(t * sp)) * .05; };
  c.type = t => { c.armL.rotation.x = -1.25 + Math.sin(t * 26) * .12; c.armR.rotation.x = -1.25 + Math.cos(t * 23) * .12; c.armL.rotation.z = .15; c.armR.rotation.z = -.15; };
  c.headPos = (v = new THREE.Vector3()) => { root.updateMatrixWorld(true); return head.localToWorld(v.set(0, .62, 0)); };
  return c;
}
/* ---------- 1) ALİ'NİN ODASI (gece) ---------- */
const room = new THREE.Group(); scene.add(room);
block(room, L(rep(planks([150, 110, 70]), 8, 8)), 8, .1, 8, 0, -.05, 0);
const wallTex = rep(pixTex(16, 16, (g, w, h) => noisy(g, w, h, [70, 90, 140], 14)), 8, 3);
block(room, L(wallTex), 8, 3.5, .1, 0, 1.75, -4); block(room, L(wallTex), .1, 3.5, 8, -4, 1.75, 0);
block(room, L(wallTex), .1, 3.5, 8, 4, 1.75, 0);
// pencere + ay
block(room, C('#0d1640'), .05, 1.1, 1.3, -3.94, 2.0, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 2.55, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 1.45, -1);
block(room, new THREE.MeshBasicMaterial({ color: '#f5f0c0' }), .06, .28, .28, -3.92, 2.2, -.7);
// poster
const posterTex = pixTex(64, 80, (g) => { g.fillStyle = '#1b5e20'; g.fillRect(0, 0, 64, 80); g.fillStyle = '#fff'; g.font = '900 11px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('MINE', 32, 30); g.fillText('CRAFT', 32, 44); g.fillStyle = '#7bc043'; g.fillRect(20, 52, 24, 18); }, true);
block(room, L(posterTex), .9, 1.1, .03, 2.2, 2.1, -3.93);
// masa, sandalye, kasa, yatak
const deskMat = L(planks([120, 82, 50]));
block(room, deskMat, 2.2, .1, 1.0, 0, .78, -3.0);
[[-1, -3.4], [1, -3.4], [-1, -2.6], [1, -2.6]].forEach(([x, z]) => block(room, deskMat, .1, .78, .1, x, .39, z));
const roomMon = makeMonitor(room, 0, .83, -3.1);
block(room, C('#333'), .35, .25, .3, -.7, .96, -3.0);  // klavye yerine hoparlör
block(room, C('#2b2b2b'), .8, .08, .3, 0, .87, -2.75); // klavye
const tower = block(room, C('#262626'), .4, .8, .8, .75, .4, -3.0);
block(room, C('#444'), .6, .08, .6, 0, .45, -1.7); block(room, C('#444'), .6, .7, .08, 0, .8, -1.4); block(room, C('#444'), .08, .45, .08, 0, .22, -1.7);
block(room, C('#b03a3a'), 2.0, .5, 1.2, 3.0, .25, 1.5); block(room, C('#eee'), .6, .2, 1.1, 3.6, .55, 1.5);
