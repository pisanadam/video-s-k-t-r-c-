<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerçek Baloncukluk</title>
<style>
  :root{ --meme: Impact, "Anton", "Arial Black", "DejaVu Sans", sans-serif; --sig:"DejaVu Sans", sans-serif; --acc:#ff5fa2; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;pointer-events:none}
  .meme{font-family:var(--meme);font-weight:900;color:#fff;text-transform:uppercase;-webkit-text-stroke:.4cqw #000;paint-order:stroke fill;letter-spacing:.04em;text-align:center;line-height:1.08}
  #top{left:2cqw;right:2cqw;top:2.4cqw;font-size:3.6cqw;opacity:0}
  #cap{left:4cqw;right:4cqw;bottom:4cqw;font-size:3.6cqw;opacity:0}
  #word{left:0;right:0;top:44%;transform:translateY(-50%);font-size:12cqw;opacity:0;white-space:nowrap}
  #stamp{left:0;right:0;top:50%;transform:translateY(-50%);font-size:7.2cqw;opacity:0;color:#ffe066;text-shadow:0 0 3cqw rgba(255,95,162,.9)}
  #title{left:0;right:0;top:48%;transform:translateY(-50%);text-align:center;font:900 6.6cqw/1.1 var(--meme);letter-spacing:.08em;color:#fff;
    text-shadow:0 0 3cqw rgba(255,95,162,.9),0 0 1cqw rgba(110,200,255,.7);opacity:0}
  #small{left:0;right:0;top:66%;text-align:center;font:400 1.9cqw/1.3 var(--sig);letter-spacing:.35em;color:#ddd;opacity:0;text-transform:lowercase}
  #flash{inset:0;background:#fff;opacity:0}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4cqw;background:rgba(0,0,0,.7);z-index:10;font-family:var(--sig)}
  #ui button{font:900 3cqw/1 var(--meme);padding:1.4cqw 3cqw;border:.3cqw solid var(--acc);cursor:pointer;background:#111;color:#fff;letter-spacing:.1em}
  #ui nav{display:flex;gap:1cqw} #ui nav a{color:#fff;border:.2cqw solid #555;padding:.6cqw 1.2cqw;text-decoration:none;font:700 1.5cqw/1 var(--sig)}
  #ui nav a.on{border-color:var(--acc);color:var(--acc)}
  #bar{position:absolute;left:0;bottom:0;height:.4cqw;background:var(--acc);width:0;z-index:5}
  body.render #ui,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="top" class="ov meme"></div>
  <div id="word" class="ov meme"></div>
  <div id="cap" class="ov meme"></div>
  <div id="stamp" class="ov meme"></div>
  <div id="title" class="ov"></div>
  <div id="small" class="ov"></div>
  <div id="flash" class="ov"></div>
  <div id="bar"></div>
  <div id="ui"><nav id="nav"></nav><button id="play">▶ OYNAT</button></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const QS = new URLSearchParams(location.search);
const VID = Math.min(3, Math.max(1, parseInt(QS.get('v') || '1', 10) || 1));
const CARD = QS.has('card') ? Math.min(4, Math.max(0, parseInt(QS.get('card'), 10) || 0)) : null; // 0 giriş, 1-3 SENARYO, 4 kapanış
const DUR = CARD === null ? 12.5 : (CARD === 0 ? 3.2 : CARD === 4 ? 3.8 : 2.2);
const RENDER_MODE = QS.has('render');
if (RENDER_MODE) document.body.classList.add('render');
const NAMES = ['balonlu sandalye', 'dev baloncuk', 'doğum günü'];
document.getElementById('nav').innerHTML = NAMES.map((n, i) => `<a href="?v=${i + 1}" class="${i + 1 === VID && CARD === null ? 'on' : ''}">${i + 1}. ${n}</a>`).join('');


/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const R = rng(11);

function pixTex(w, h, draw, linear = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (!linear) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noisy(g, w, h, base, vary, r = R) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = (r() - .5) * vary;
    g.fillStyle = `rgb(${clamp(base[0] + v, 0, 255)},${clamp(base[1] + v, 0, 255)},${clamp(base[2] + v, 0, 255)})`; g.fillRect(x, y, 1, 1); }
}
const planks = (base) => pixTex(16, 16, (g, w, h) => { noisy(g, w, h, base, 22); g.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1); g.fillRect(7, 0, 1, 4); g.fillRect(2, 4, 1, 4); g.fillRect(11, 8, 1, 4); g.fillRect(5, 12, 1, 4); });
function rep(t, x, y) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; }

/* ---------- sahne ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16 / 9, .05, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#555', 1.1); scene.add(hemi);
const dir = new THREE.DirectionalLight('#fff4e0', 1.2); dir.position.set(5, 10, 6); scene.add(dir);
const pink = new THREE.PointLight('#ff4fa8', 0, 6, 1.5); scene.add(pink);

const L = (m, o = {}) => new THREE.MeshLambertMaterial({ map: m, ...o });
const C = c => new THREE.MeshLambertMaterial({ color: c });
const BOX = new THREE.BoxGeometry(1, 1, 1);
function block(parent, mat, sx, sy, sz, x, y, z) { const m = new THREE.Mesh(BOX, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m; }

/* ---------- monitör ekranları (canlı canvas) ---------- */
const screens = [];
function makeMonitor(parent, x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  block(g, C('#222'), .12, .3, .12, 0, .15, -.05); block(g, C('#222'), .4, .04, .3, 0, .02, -.05);
  block(g, C('#1a1a1a'), 1.0, .64, .08, 0, .6, -.05);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 160;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(.9, .55), new THREE.MeshBasicMaterial({ map: tex }));
  mesh.position.set(0, .6, -.005); g.add(mesh);
  const s = { cv, g: cv.getContext('2d'), tex, key: '', group: g }; screens.push(s); return s;
}
function drawScreen(s, state, p = 0, t = 0, fps = 0) {
  const key = state + '|' + (state === 'jenny' ? Math.floor(t * 8) + '|' + fps : Math.floor(p * 40));
  if (key === s.key) return; s.key = key;
  const g = s.g, W = 256, H = 160; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state === 'off') { g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, W, H); }
  else if (state === 'download') {
    g.fillStyle = '#10182a'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = '700 15px "DejaVu Sans Mono",monospace';
    g.fillText(p < 1 ? 'jenny_mod.jar' : 'jenny_mod.jar', W / 2, 46); g.font = '700 12px "DejaVu Sans Mono",monospace';
    g.fillStyle = '#9fb3d9'; g.fillText(p < 1 ? 'indiriliyor... %' + Math.floor(p * 100) : 'KURULDU ✓', W / 2, 70);
    g.fillStyle = '#333'; g.fillRect(28, 92, 200, 16); g.fillStyle = p < 1 ? '#4caf50' : '#ff4fa8'; g.fillRect(30, 94, 196 * p, 12);
  } else if (state === 'jenny') {
    const f = Math.floor(t * 8);
    g.fillStyle = f % 2 ? '#ff5fb0' : '#ff7cc0'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 18; i++) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(hash(i + f * 31) * W, hash(i * 7 + f) * H, 10, 10); }
    g.fillStyle = '#fff'; g.strokeStyle = '#7a1b4f'; g.lineWidth = 6; g.font = '900 38px Impact,"DejaVu Sans",sans-serif';
    g.strokeText('JENNY MOD', W / 2, 62); g.fillText('JENNY MOD', W / 2, 62);
    g.font = '700 16px "DejaVu Sans Mono",monospace'; g.fillStyle = '#ffe14a'; g.fillText('FPS: ' + fps, W / 2, 104);
    g.fillStyle = '#7a1b4f'; for (let i = 0; i < 8; i++) { g.globalAlpha = ((i + f) % 8) / 8; g.fillRect(W / 2 - 40 + i * 10, 128, 7, 7); } g.globalAlpha = 1;
  }
  else if (state === 'docx') {
    g.fillStyle = '#f4f6fb'; g.fillRect(0, 0, W, H); g.fillStyle = '#2b579a'; g.fillRect(0, 0, W, 22);
    g.fillStyle = '#fff'; g.font = '700 11px "DejaVu Sans",sans-serif'; g.fillText('Matematik_Odevi.docx', W / 2, 12);
    g.fillStyle = '#222'; g.font = '700 13px "DejaVu Serif",serif'; g.fillText('MATEMATİK ÖDEVİ', W / 2, 42);
    g.fillStyle = '#999'; for (let i = 0; i < 6; i++) g.fillRect(28, 60 + i * 14, 200 - (i % 3) * 30, 5);
  }
  s.tex.needsUpdate = true;
}

function faceTex(kind, o) {
  return pixTex(8, 8, g => {
    const P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
    g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8);
    if (!o.bald) { for (let x = 0; x < 8; x++) P(x, 0, o.hair); [0, 7].forEach(x => P(x, 1, o.hair)); } if (o.bangs) for (let x = 0; x < 6; x++) P(x, 1, o.hair);
    const E = o.eye || '#4b3a8c', M = '#4a1e10';
    P(3, 5, o.nose || '#9a6040'); P(4, 5, o.nose || '#9a6040');
    if (kind === 'happy' || kind === 'talk') {
      P(1, 4, '#fff'); P(2, 4, E); P(5, 4, E); P(6, 4, '#fff');
      if (kind === 'happy') { P(1, 6, M); P(6, 6, M); for (let x = 2; x <= 5; x++) P(x, 7, M); for (let x = 2; x <= 5; x++) P(x, 6, '#fff'); }
      else { for (let x = 2; x <= 5; x++) { P(x, 6, M); P(x, 7, M); } P(3, 7, '#c0404a'); P(4, 7, '#c0404a'); }
    } else if (kind === 'sneaky') {
      P(1, 4, E); P(2, 4, E); P(5, 4, E); P(6, 4, E); for (const x of [1, 2, 5, 6]) P(x, 3, o.hair);
      P(2, 6, M); P(3, 6, M); P(4, 6, M); P(5, 6, '#fff'); P(6, 5, M);
    } else if (kind === 'shock') {
      for (const ex of [1, 5]) { P(ex, 3, '#fff'); P(ex + 1, 3, '#fff'); P(ex, 4, '#fff'); P(ex + 1, 4, '#fff'); }
      P(2, 4, '#111'); P(5, 4, '#111'); for (const x of [1, 2, 5, 6]) P(x, 2, o.hair);
      P(3, 6, '#2a0d06'); P(4, 6, '#2a0d06'); P(3, 7, '#2a0d06'); P(4, 7, '#2a0d06');
    } else if (kind === 'angry') {
      P(1, 2, '#111'); P(2, 3, '#111'); P(6, 2, '#111'); P(5, 3, '#111');
      P(1, 4, '#fff'); P(2, 4, '#c00'); P(5, 4, '#c00'); P(6, 4, '#fff');
      for (let x = 2; x <= 5; x++) P(x, 6, M); P(1, 7, M); P(6, 7, M);
    } else if (kind === 'relaxed') {
      for (const x of [1, 2, 5, 6]) P(x, 4, '#3a1d0e'); P(0, 5, '#e8907a'); P(7, 5, '#e8907a');
      P(2, 6, M); P(5, 6, M); P(3, 7, M); P(4, 7, M);
    } else if (kind === 'scared') {
      P(1, 3, '#fff'); P(2, 3, '#111'); P(5, 3, '#111'); P(6, 3, '#fff'); P(2, 2, o.hair); P(5, 2, o.hair);
      for (let y = 4; y < 8; y++) { P(1, y, '#57c7ff'); P(6, y, '#57c7ff'); }
      P(2, 7, M); P(3, 6, M); P(4, 6, M); P(5, 7, M);
    }
    if (o.glasses) { g.fillStyle = '#111'; g.fillRect(0, 4, 8, 1); P(1, 3, '#111'); P(2, 3, '#111'); P(5, 3, '#111'); P(6, 3, '#111'); if (kind !== 'angry') { P(1, 4, '#fff'); P(6, 4, '#fff'); P(2, 4, '#111'); P(5, 4, '#111'); } else { P(2, 4, '#c00'); P(5, 4, '#c00'); } }
    if (o.mustache) { for (let x = 1; x <= 6; x++) P(x, 6, o.mustache); }
    if (o.beard) { for (let x = 0; x < 8; x++) P(x, 7, o.hair); P(0, 6, o.hair); P(7, 6, o.hair); P(0, 5, o.hair); P(7, 5, o.hair); if (kind === 'angry' || kind === 'talk') { P(3, 7, '#2a0d06'); P(4, 7, '#2a0d06'); } }
  });
}
function makeChar(o) {
  const faces = {}; ['happy', 'talk', 'sneaky', 'shock', 'angry', 'scared', 'relaxed'].forEach(k => faces[k] = faceTex(k, o));
  const side = pixTex(8, 8, g => { g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8); g.fillStyle = o.hair; if (o.bald) g.fillRect(0, 2, 3, 2); else { g.fillRect(0, 0, 8, 2); g.fillRect(0, 2, 2, 1); g.fillRect(6, 2, 2, 1); } if (o.beard) g.fillRect(0, 5, 3, 3); if (o.glasses) { g.fillStyle = '#111'; g.fillRect(0, 4, 8, 1); } });
  const hairT = pixTex(8, 8, (g, w, h) => noisy(g, w, h, new THREE.Color(o.bald ? o.skin : o.hair).toArray().map(v => v * 255), 18));
  const faceMat = new THREE.MeshLambertMaterial({ map: faces.happy });
  const root = new THREE.Group(); scene.add(root);
  const body = new THREE.Group(); root.add(body);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.5, .75, .25), C(o.shirt)); torso.position.y = 1.125; body.add(torso);
  if (o.tie) block(body, C(o.tie), .08, .45, .02, 0, 1.25, .13);
  const head = new THREE.Group(); head.position.y = 1.5; body.add(head);
  const hm = new THREE.Mesh(new THREE.BoxGeometry(.5, .5, .5), [L(side), L(side), L(hairT), C(o.skin), faceMat, L(hairT)]); hm.position.y = .25; head.add(hm);
  const mkArm = s => { const g = new THREE.Group(); g.position.set(s * .375, 1.4, 0);
    const sl = new THREE.Mesh(new THREE.BoxGeometry(.25, .35, .25), C(o.shirt)); sl.position.y = -.07; g.add(sl);
    const hd = new THREE.Mesh(new THREE.BoxGeometry(.24, .45, .24), C(o.sleeve || o.skin)); hd.position.y = -.47; g.add(hd); body.add(g); return g; };
  const mkLeg = s => { const g = new THREE.Group(); g.position.set(s * .125, .75, 0);
    const p = new THREE.Mesh(new THREE.BoxGeometry(.25, .6, .25), C(o.pants)); p.position.y = -.3; g.add(p);
    const sh = new THREE.Mesh(new THREE.BoxGeometry(.25, .15, .25), C(o.shoe || '#333')); sh.position.y = -.675; g.add(sh); root.add(g); return g; };
  const c = { root, body, head, faceMat, faces, armL: mkArm(-1), armR: mkArm(1), legL: mkLeg(-1), legR: mkLeg(1) };
  root.scale.setScalar(o.scale || 1);
  c.reset = () => { root.visible = false; root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);
    [head, c.armL, c.armR, c.legL, c.legR].forEach(p => p.rotation.set(0, 0, 0)); c.face('happy'); };
  c.face = k => { c.faceMat.map = faces[k]; };
  c.sit = () => { root.position.y -= .3; c.legL.rotation.x = c.legR.rotation.x = -Math.PI / 2; };
  c.walk = (t, sp = 9, a = .7) => { const s = Math.sin(t * sp); c.legL.rotation.x = s * a; c.legR.rotation.x = -s * a; c.armL.rotation.x = -s * a; c.armR.rotation.x = s * a; body.position.y = Math.abs(Math.cos(t * sp)) * .05; };
  c.type = t => { c.armL.rotation.x = -1.25 + Math.sin(t * 26) * .12; c.armR.rotation.x = -1.25 + Math.cos(t * 23) * .12; c.armL.rotation.z = .15; c.armR.rotation.z = -.15; };
  c.headPos = (v = new THREE.Vector3()) => { root.updateMatrixWorld(true); return head.localToWorld(v.set(0, .62, 0)); };
  return c;
}
/* ---------- 1) ALİ'NİN ODASI (gece) ---------- */
const room = new THREE.Group(); scene.add(room);
block(room, L(rep(planks([150, 110, 70]), 8, 8)), 8, .1, 8, 0, -.05, 0);
const wallTex = rep(pixTex(16, 16, (g, w, h) => noisy(g, w, h, [70, 90, 140], 14)), 8, 3);
block(room, L(wallTex), 8, 3.5, .1, 0, 1.75, -4); block(room, L(wallTex), .1, 3.5, 8, -4, 1.75, 0);
block(room, L(wallTex), .1, 3.5, 8, 4, 1.75, 0);
// pencere + ay
block(room, C('#0d1640'), .05, 1.1, 1.3, -3.94, 2.0, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 2.55, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 1.45, -1);
block(room, new THREE.MeshBasicMaterial({ color: '#f5f0c0' }), .06, .28, .28, -3.92, 2.2, -.7);
// poster
const posterTex = pixTex(64, 80, (g) => { g.fillStyle = '#1b5e20'; g.fillRect(0, 0, 64, 80); g.fillStyle = '#fff'; g.font = '900 11px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('MINE', 32, 30); g.fillText('CRAFT', 32, 44); g.fillStyle = '#7bc043'; g.fillRect(20, 52, 24, 18); }, true);
block(room, L(posterTex), .9, 1.1, .03, 2.2, 2.1, -3.93);
// masa, sandalye, kasa, yatak
const deskMat = L(planks([120, 82, 50]));
block(room, deskMat, 2.2, .1, 1.0, 0, .78, -3.0);
[[-1, -3.4], [1, -3.4], [-1, -2.6], [1, -2.6]].forEach(([x, z]) => block(room, deskMat, .1, .78, .1, x, .39, z));
const roomMon = makeMonitor(room, 0, .83, -3.1);
block(room, C('#333'), .35, .25, .3, -.7, .96, -3.0);  // klavye yerine hoparlör
block(room, C('#2b2b2b'), .8, .08, .3, 0, .87, -2.75); // klavye
const tower = block(room, C('#262626'), .4, .8, .8, .75, .4, -3.0);
block(room, C('#444'), .6, .08, .6, 0, .45, -1.7); block(room, C('#444'), .6, .7, .08, 0, .8, -1.4); block(room, C('#444'), .08, .45, .08, 0, .22, -1.7);
block(room, C('#b03a3a'), 2.0, .5, 1.2, 3.0, .25, 1.5); block(room, C('#eee'), .6, .2, 1.1, 3.6, .55, 1.5);

/* ---------- KARAKTERLER ---------- */
const sen = makeChar({ skin: '#d9a47e', hair: '#3b2414', shirt: '#2e2e35', sleeve: '#2e2e35', pants: '#1f2937', shoe: '#f2f2f2', bangs: true, eye: '#2a1a10' });
const shades = new THREE.Group(); sen.head.add(shades);
block(shades, new THREE.MeshLambertMaterial({ color: '#050505' }), .54, .11, .04, 0, .25, .27);
block(shades, new THREE.MeshBasicMaterial({ color: '#ffffff' }), .07, .03, .01, -.15, .28, .295);
block(shades, new THREE.MeshBasicMaterial({ color: '#ffffff' }), .07, .03, .01, .13, .28, .295);
const hoca = makeChar({ skin: '#cf9a76', hair: '#5d5d5d', shirt: '#3d4450', sleeve: '#3d4450', pants: '#1d1d22', shoe: '#111', glasses: true, beard: true, tie: '#8e1b1b', scale: 1.13, eye: '#333' });
const extras = [
  makeChar({ skin: '#c58c63', hair: '#5a3a1e', shirt: '#f1c40f', pants: '#2747a0', eye: '#2a6b2a' }),
  makeChar({ skin: '#e8bf9c', hair: '#d8b04a', shirt: '#27ae60', pants: '#666', bangs: true, eye: '#2a4fb0' }),
  makeChar({ skin: '#e3b08c', hair: '#6b3b1f', shirt: '#e74c3c', pants: '#333', bangs: true, eye: '#3b2a1a' }),
  makeChar({ skin: '#b97f58', hair: '#222', shirt: '#e67e22', pants: '#2c3e50', eye: '#222' }),

  setHTML(el.word, word); el.word.style.opacity = word ? 1 : 0; el.word.style.color = '#ffe066';
  el.word.style.transform = `translateY(-50%) scale(${1 + .4 * (1 - easeOutBack(seg(t, 4.5, 4.8)))}) rotate(-3deg)`;
  const sk = seg(t, STAMP_T, STAMP_T + .3); setHTML(el.stamp, 'İŞTE GERÇEK<br>BALONCUKLUK BUDUR'); el.stamp.style.opacity = sk;
  el.stamp.style.transform = `translateY(-50%) scale(${1 + .5 * (1 - easeOutBack(sk))}) rotate(-2deg)`;
  if (t > STAMP_T && t < STAMP_T + .2) fl = Math.max(fl, .6 * (1 - seg(t, STAMP_T, STAMP_T + .2))); 
  el.flash.style.opacity = fl; el.flash.style.background = fc;
  el.title.style.opacity = 0; el.small.style.opacity = 0; el.top.style.opacity = 0;
  el.bar.style.width = (t / DUR * 100) + '%';
}

/* ---------- SES ---------- */
function buildAudio(ac, T) {
  const out = ac.createDynamicsCompressor(); out.threshold.value = -14; out.ratio.value = 6; out.connect(ac.destination);
  const master = ac.createGain(); master.gain.value = .7; master.connect(out);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let seed = 77; const nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  { const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 2147483647 * 2 - 1; } }
  const env = (g, s, dur, vol, att = .008) => { g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + att); g.gain.exponentialRampToValueAtTime(.0001, s + dur); };
  function tone(type, f, s, dur, vol, { fEnd, dest = master, vib = 0, lp = 0 } = {}) {
    s += T; const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, s);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, s + dur);
    const g = ac.createGain(); env(g, s, dur, vol); let n = o;
    if (lp) { const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); n = f2; }
    n.connect(g); g.connect(dest);
    if (vib) { const l = ac.createOscillator(); l.frequency.value = 6; const lg = ac.createGain(); lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(s); l.stop(s + dur + .05); }
    o.start(s); o.stop(s + dur + .05);
  }
  function noise(s, dur, vol, freq, type = 'lowpass', dest = master) {
    s += T; const n = ac.createBufferSource(); n.buffer = nbuf; n.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); env(g, s, dur, vol, .004); n.connect(f); f.connect(g); g.connect(dest); n.start(s); n.stop(s + dur + .05);
  }
  const dist = ac.createWaveShaper(); { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) c[i] = Math.tanh((i / 512 - 1) * 9); dist.curve = c; }
  const dg = ac.createGain(); dg.gain.value = .55; dist.connect(dg); dg.connect(master);
  function boom(s, big) { tone('sine', big ? 150 : 120, s, big ? 2.2 : 1, 1, { fEnd: 32 }); noise(s, big ? .7 : .35, .7, 500);
    if (big) { tone('sine', 110, s, 1.8, .9, { fEnd: 30, dest: dist }); noise(s, 1, .5, 1200, 'lowpass', dist); tone('sawtooth', 220, s, 1.2, .25, { fEnd: 55 }); } }
  function mumble(s, dur, base) { for (let x = 0; x < dur; x += .085) tone('square', base * (1 + (hash(s * 10 + x * 37) - .5) * .5), s + x, .07, .05, { lp: 1600 }); }
  const keys = (a, b) => { for (let x = a; x < b; x += .11) noise(x + hash(x) * .05, .025, .08, 3000, 'highpass'); };
  // --- phonk aletleri ---
  const verb = ac.createConvolver(); { const len = ac.sampleRate * 2.2, b = ac.createBuffer(2, len, ac.sampleRate); let sd = 3;
    for (let ch = 0; ch < 2; ch++) { const dd = b.getChannelData(ch); for (let i = 0; i < len; i++) { sd = (sd * 16807) % 2147483647; dd[i] = (sd / 2147483647 * 2 - 1) * Math.pow(1 - i / len, 3); } } verb.buffer = b; }
  const vg = ac.createGain(); vg.gain.value = .35; verb.connect(vg); vg.connect(master);
  function cowbell(f, s, vol = .09) { [1, 1.48].forEach(m => { const ss = s + T; const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f * m;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.2; const g = ac.createGain(); env(g, ss, .28, vol, .002);
    o.connect(bp); bp.connect(g); g.connect(master); g.connect(verb); o.start(ss); o.stop(ss + .35); }); }
  const kick = s => { tone('sine', 160, s, .45, .9, { fEnd: 38 }); };
  const b808 = (f, s, d = .55) => { tone('sine', f, s, d, .55, { fEnd: f * .92, dest: dist }); tone('sine', f, s, d, .5, { fEnd: f * .92 }); };
  const clap = s => { noise(s, .16, .45, 1600, 'bandpass'); noise(s + .012, .12, .3, 1300, 'bandpass', dist); };
  const hat = (s, v = .08) => noise(s, .03, v, 8000, 'highpass');
  function phonk(a, b, { bpm = 130, root = 41, mel }) {
    const st = 60 / bpm / 4; let i = 0;
    for (let s = a; s < b - .01; s += st, i++) { const k = i % 16, bar = (i / 16 | 0);
      if (k === 0 || k === 7 || k === 10) { kick(s); b808(mtof(root + (bar % 2 && k === 10 ? 3 : 0)), s); }
      if (k === 4 || k === 12) clap(s);
      if (k % 2 === 0) hat(s, k % 4 ? .05 : .08);
      const m = mel[(i) % mel.length]; if (m != null) cowbell(mtof(m), s);
    }
  }
  const pad = (notes, s, d, v = .05) => notes.forEach(m => { tone('sawtooth', mtof(m), s, d, v, { lp: 900 }); tone('sine', mtof(m + 12), s, d, v * .6); });
  const riser = (s, d) => { noise(s, d, .18, 1200, 'bandpass'); tone('sine', 200, s, d, .06, { fEnd: 1800 }); };
  const MEL1 = [65, null, 65, 68, null, 65, 63, null, 60, null, 63, null, 65, 68, 70, null];
  const MEL2 = [72, null, null, 72, 70, null, 67, null, 72, null, 75, null, 74, null, 70, null];

  const choir = (notes, s, d, v = .045) => notes.forEach((m, i) => { tone('sawtooth', mtof(m), s, d, v, { lp: 1400, vib: 3 + i }); tone('triangle', mtof(m + 12), s, d, v * .7, { vib: 4 }); });
  const plus = s => { boom(s, false); choir([60, 64, 67, 72], s, 2.2, .05); tone('sine', mtof(96), s, 1.2, .08); tone('sine', mtof(103), s + .08, 1.2, .06); };
  const minus = s => { boom(s, true); tone('sawtooth', 600, s, 1.4, .18, { fEnd: 60, lp: 1800 }); };
  const steps = (a, b, gap, v = .12) => { for (let x = a; x < b; x += gap) noise(x, .05, v, 650, 'bandpass'); };
  // ===== BALONCUKLUK =====
  const pluck = (m, s, v = .1) => { tone('triangle', mtof(m), s, .35, v); tone('sine', mtof(m + 12), s, .2, v * .4); };
  const PROG = [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]];
  const uke = (a, b, bt = .5, up = 0, v = .06) => { for (let i = 0; a + i * bt < b; i++) { const s = a + i * bt, ch = PROG[(i >> 2) % 4]; ch.forEach((m, j) => pluck(m + up, s + j * .03, v)); if (i % 2 === 0) tone('triangle', mtof(ch[0] - 24 + up), s, .45, .16); if (i % 2) noise(s, .05, .07, 3000, 'bandpass'); } };
  const stampSfx = s => { boom(s, false); choir([60, 64, 67, 72], s, 2.4, .045); tone('sine', mtof(96), s, 1, .06); tone('sine', mtof(100), s + .1, 1, .05); tone('sine', mtof(103), s + .2, 1.2, .05); };
  const inflate = (s, d) => { for (let x = 0; x < d; x += .22) { noise(s + x, .14, .07, 900 + x * 300, 'bandpass'); } };
  if (CARD !== null) {
    riser(0, .3); boom(.25, false); for (let i = 0; i < 6; i++) tone('sine', 500 + i * 120, .5 + i * .12, .12, .07, { fEnd: 1200 + i * 200 });
    if (CARD === 0 || CARD === 4) uke(.3, DUR, .4, 0, .05);
  } else if (VID === 1) {
    uke(0, 10, .45); inflate(.1, 2.6); for (let i = 0; i < 12; i++) tone('sine', 300 + i * 40, .1 + i * .21, .1, .05, { fEnd: 900 });
    mumble(3.2, 1.8, 150); tone('sine', 300, 3.0, 1.6, .06, { fEnd: 700 }); boom(4.6, false); noise(4.6, .1, .3, 300);
    noise(6.2, .5, .4, 4000, 'highpass'); tone('sine', 400, 6.2, 3.5, .05, { fEnd: 1400 }); noise(6.5, 2.5, .08, 1500, 'bandpass'); mumble(6.3, 2.4, 300);
    stampSfx(STAMP_T);
  } else if (VID === 2) {
    uke(0, 10, .5, 2, .05); for (let x = .2; x < 6; x += .37) tone('sine', 700 + hash(x) * 700, x, .08, .05, { fEnd: 1800 });
    for (let x = .2; x < 3.6; x += .4) noise(x, .05, .08, 600, 'bandpass');
    inflate(3.0, 1.6); tone('sine', 200, 3.0, 1.6, .08, { fEnd: 600 });
    noise(5.0, 2.5, .12, 3000, 'highpass'); tone('sine', 900, 5.0, 3, .02, { fEnd: 2400 }); tone('sine', 300, 6.2, 3.2, .05, { fEnd: 1500 });
    stampSfx(STAMP_T);
  } else {
    // hüzünlü piyano
    [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]].forEach((ch, i) => ch.forEach((m, j) => tone('triangle', mtof(m), .2 + i * .8 + j * .08, 1.2, .07)));
    steps(.2, 3, .45, .08);
    noise(3.4, .05, .4, 2000, 'bandpass'); tone('sine', 60, 3.4, 1, .1);
    boom(4.5, true); noise(4.5, .3, .5, 3000, 'highpass'); mumble(4.5, 1.2, 330); for (let i = 0; i < 10; i++) noise(4.5 + i * .1, .3, .25, 1500 + i * 200, 'bandpass');
    // "İyi ki doğdun" melodisi
    const HB = [[67, .3], [67, .15], [69, .45], [67, .45], [72, .45], [71, .9], [67, .3], [67, .15], [69, .45], [67, .45], [74, .45], [72, .9]];
    let s = 5.6; HB.forEach(([m, d]) => { tone('square', mtof(m), s, d * .95, .06); tone('triangle', mtof(m - 12), s, d * .95, .1); s += d; });
    for (let i = 0; i < 10; i++) tone('triangle', mtof([48, 55, 53, 55][i % 4]), 5.6 + i * .45, .4, .14);
    stampSfx(STAMP_T);
  }
}


/* ---------- oynatma ---------- */
function resize() { const r = stageRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderAt(0);

if (RENDER_MODE) {
  window.renderAt = t => renderAt(t); window.DUR = DUR;
  window.renderAudioWav = async () => {
    const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oac, 0); const buf = await oac.startRendering();
    const n = buf.length, d = new DataView(new ArrayBuffer(44 + n * 4)); const S = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
    S(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); S(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
    d.setUint32(24, sr, true); d.setUint32(28, sr * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); S(36, 'data'); d.setUint32(40, n * 4, true);
    const a = buf.getChannelData(0), b = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, clamp(a[i], -1, 1) * 32767, true); d.setInt16(46 + i * 4, clamp(b[i], -1, 1) * 32767, true); }
    const u8 = new Uint8Array(d.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.READY = true;
} else {
  let ac = null, start = 0; const now = () => ac ? ac.currentTime : performance.now() / 1000;
  const schedule = () => { start = now() + .08; if (ac) buildAudio(ac, start); };
  $('play').onclick = async () => {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume(); } catch (e) { ac = null; }
    $('ui').style.display = 'none'; schedule();
    (function loop() { let t = now() - start; if (t >= DUR) { schedule(); t = 0; } renderAt(Math.max(0, t)); requestAnimationFrame(loop); })();
  };
}
</script>
