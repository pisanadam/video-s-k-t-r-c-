<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali ve Jenny Mod</title>
<style>
  :root{ --meme: Impact, "Anton", "Arial Black", "DejaVu Sans", sans-serif; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:var(--meme)}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;pointer-events:none}
  .meme{font-family:var(--meme);font-weight:900;color:#fff;text-transform:uppercase;-webkit-text-stroke:.45cqw #000;
    paint-order:stroke fill;letter-spacing:.05em;text-align:center;line-height:1.05}
  #top{left:2cqw;right:2cqw;top:2.6cqw;font-size:4.2cqw}
  #cap{left:0;right:0;bottom:4.5cqw;font-size:4.6cqw}
  #big{left:0;right:0;top:72%;font-size:8cqw;transform:translateY(-50%)}
  #hud{left:2cqw;top:9cqw;padding:.6cqw 1.2cqw;background:rgba(0,0,0,.5);font:700 2.6cqw/1 "DejaVu Sans Mono",monospace;color:#ff3b3b;opacity:0;white-space:pre}
  .bub{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 1.6cqw));background:#fff;color:#111;
    border:.35cqw solid #111;border-radius:1.4cqw;padding:.9cqw 1.4cqw;font:900 2.3cqw/1.15 var(--meme);text-transform:uppercase;
    max-width:34cqw;text-align:center;opacity:0;letter-spacing:.03em}
  .bub::after{content:"";position:absolute;left:50%;bottom:-1.6cqw;transform:translateX(-50%);border:.9cqw solid transparent;border-top:1.4cqw solid #111}
  .bub b{color:#d0157a}
  #flash{inset:0;background:#fff;opacity:0}
  #vig{inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(120,0,0,.85) 100%);opacity:0}
  #card{inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;opacity:0}
  #card .a{font-size:6.5cqw;color:#ff4040}
  #card .b{font-size:3.4cqw}
  #card .c{font:400 2cqw/1.3 "DejaVu Sans",sans-serif;color:#bbb;font-style:italic}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5cqw;background:rgba(0,0,0,.6);z-index:10}
  #ui button{font:900 3.2cqw/1 var(--meme);padding:1.6cqw 3.4cqw;border:.4cqw solid #000;cursor:pointer;background:#e0457b;color:#fff;
    -webkit-text-stroke:.2cqw #000;paint-order:stroke fill;box-shadow:inset -.5cqw -.5cqw 0 rgba(0,0,0,.35),inset .5cqw .5cqw 0 rgba(255,255,255,.35)}
  #ui .hint{font:400 1.6cqw/1.3 "DejaVu Sans",sans-serif;color:#ddd}
  #bar{position:absolute;left:0;bottom:0;height:.5cqw;background:#ffd84a;width:0;z-index:5}
  body.render #ui,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig" class="ov"></div>
  <div id="hud" class="ov"></div>
  <div id="b0" class="bub"></div>
  <div id="b1" class="bub"></div>
  <div id="b2" class="bub"></div>
  <div id="top" class="ov meme"></div>
  <div id="big" class="ov meme"></div>
  <div id="cap" class="ov meme"></div>
  <div id="card" class="ov meme">
    <div class="a">VELİLER ARANDI</div>
    <div class="b">SONUÇ: ALİ 1 AY BİLGİSAYARSIZ</div>
    <div class="c">Ali'nin annesi: "eve gel sen, eve gel..."</div>
  </div>
  <div id="flash" class="ov"></div>
  <div id="bar"></div>
  <div id="ui"><button id="play">▶ OYNAT (SESLİ)</button>
    <div class="hint">Ali Jenny Mod kurdu · okulda anlattı · hocayı da çağırdılar...</div></div>
</div>

<script type="module">
import * as THREE from 'three';

const DUR = 34;
const RENDER_MODE = new URLSearchParams(location.search).has('render');
if (RENDER_MODE) document.body.classList.add('render');

/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const R = rng(11);

function pixTex(w, h, draw, linear = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (!linear) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noisy(g, w, h, base, vary, r = R) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = (r() - .5) * vary;
    g.fillStyle = `rgb(${clamp(base[0] + v, 0, 255)},${clamp(base[1] + v, 0, 255)},${clamp(base[2] + v, 0, 255)})`; g.fillRect(x, y, 1, 1); }
}
const planks = (base) => pixTex(16, 16, (g, w, h) => { noisy(g, w, h, base, 22); g.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1); g.fillRect(7, 0, 1, 4); g.fillRect(2, 4, 1, 4); g.fillRect(11, 8, 1, 4); g.fillRect(5, 12, 1, 4); });
function rep(t, x, y) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; }

/* ---------- sahne ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16 / 9, .05, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#555', 1.1); scene.add(hemi);
const dir = new THREE.DirectionalLight('#fff4e0', 1.2); dir.position.set(5, 10, 6); scene.add(dir);
const pink = new THREE.PointLight('#ff4fa8', 0, 6, 1.5); scene.add(pink);

const L = (m, o = {}) => new THREE.MeshLambertMaterial({ map: m, ...o });
const C = c => new THREE.MeshLambertMaterial({ color: c });
const BOX = new THREE.BoxGeometry(1, 1, 1);
function block(parent, mat, sx, sy, sz, x, y, z) { const m = new THREE.Mesh(BOX, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m; }

/* ---------- monitör ekranları (canlı canvas) ---------- */
const screens = [];
function makeMonitor(parent, x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  block(g, C('#222'), .12, .3, .12, 0, .15, -.05); block(g, C('#222'), .4, .04, .3, 0, .02, -.05);
  block(g, C('#1a1a1a'), 1.0, .64, .08, 0, .6, -.05);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 160;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(.9, .55), new THREE.MeshBasicMaterial({ map: tex }));
  mesh.position.set(0, .6, -.005); g.add(mesh);
  const s = { cv, g: cv.getContext('2d'), tex, key: '', group: g }; screens.push(s); return s;
}
function drawScreen(s, state, p = 0, t = 0, fps = 0) {
  const key = state + '|' + (state === 'jenny' ? Math.floor(t * 8) + '|' + fps : Math.floor(p * 40));
  if (key === s.key) return; s.key = key;
  const g = s.g, W = 256, H = 160; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state === 'off') { g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, W, H); }
  else if (state === 'download') {
    g.fillStyle = '#10182a'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = '700 15px "DejaVu Sans Mono",monospace';
    g.fillText(p < 1 ? 'jenny_mod.jar' : 'jenny_mod.jar', W / 2, 46); g.font = '700 12px "DejaVu Sans Mono",monospace';
    g.fillStyle = '#9fb3d9'; g.fillText(p < 1 ? 'indiriliyor... %' + Math.floor(p * 100) : 'KURULDU ✓', W / 2, 70);
    g.fillStyle = '#333'; g.fillRect(28, 92, 200, 16); g.fillStyle = p < 1 ? '#4caf50' : '#ff4fa8'; g.fillRect(30, 94, 196 * p, 12);
  } else if (state === 'jenny') {
    const f = Math.floor(t * 8);
    g.fillStyle = f % 2 ? '#ff5fb0' : '#ff7cc0'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 18; i++) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(hash(i + f * 31) * W, hash(i * 7 + f) * H, 10, 10); }
    g.fillStyle = '#fff'; g.strokeStyle = '#7a1b4f'; g.lineWidth = 6; g.font = '900 38px Impact,"DejaVu Sans",sans-serif';
    g.strokeText('JENNY MOD', W / 2, 62); g.fillText('JENNY MOD', W / 2, 62);
    g.font = '700 16px "DejaVu Sans Mono",monospace'; g.fillStyle = '#ffe14a'; g.fillText('FPS: ' + fps, W / 2, 104);
    g.fillStyle = '#7a1b4f'; for (let i = 0; i < 8; i++) { g.globalAlpha = ((i + f) % 8) / 8; g.fillRect(W / 2 - 40 + i * 10, 128, 7, 7); } g.globalAlpha = 1;
  }
  s.tex.needsUpdate = true;
}

/* ---------- 1) ALİ'NİN ODASI (gece) ---------- */
const room = new THREE.Group(); scene.add(room);
block(room, L(rep(planks([150, 110, 70]), 8, 8)), 8, .1, 8, 0, -.05, 0);
const wallTex = rep(pixTex(16, 16, (g, w, h) => noisy(g, w, h, [70, 90, 140], 14)), 8, 3);
block(room, L(wallTex), 8, 3.5, .1, 0, 1.75, -4); block(room, L(wallTex), .1, 3.5, 8, -4, 1.75, 0);
block(room, L(wallTex), .1, 3.5, 8, 4, 1.75, 0);
// pencere + ay
block(room, C('#0d1640'), .05, 1.1, 1.3, -3.94, 2.0, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 2.55, -1); block(room, C('#5a3a20'), .07, .08, 1.4, -3.93, 1.45, -1);
block(room, new THREE.MeshBasicMaterial({ color: '#f5f0c0' }), .06, .28, .28, -3.92, 2.2, -.7);
// poster
const posterTex = pixTex(64, 80, (g) => { g.fillStyle = '#1b5e20'; g.fillRect(0, 0, 64, 80); g.fillStyle = '#fff'; g.font = '900 11px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('MINE', 32, 30); g.fillText('CRAFT', 32, 44); g.fillStyle = '#7bc043'; g.fillRect(20, 52, 24, 18); }, true);
block(room, L(posterTex), .9, 1.1, .03, 2.2, 2.1, -3.93);
// masa, sandalye, kasa, yatak
const deskMat = L(planks([120, 82, 50]));
block(room, deskMat, 2.2, .1, 1.0, 0, .78, -3.0);
[[-1, -3.4], [1, -3.4], [-1, -2.6], [1, -2.6]].forEach(([x, z]) => block(room, deskMat, .1, .78, .1, x, .39, z));
const roomMon = makeMonitor(room, 0, .83, -3.1);
block(room, C('#333'), .35, .25, .3, -.7, .96, -3.0);  // klavye yerine hoparlör
block(room, C('#2b2b2b'), .8, .08, .3, 0, .87, -2.75); // klavye
const tower = block(room, C('#262626'), .4, .8, .8, .75, .4, -3.0);
block(room, C('#444'), .6, .08, .6, 0, .45, -1.7); block(room, C('#444'), .6, .7, .08, 0, .8, -1.4); block(room, C('#444'), .08, .45, .08, 0, .22, -1.7);
block(room, C('#b03a3a'), 2.0, .5, 1.2, 3.0, .25, 1.5); block(room, C('#eee'), .6, .2, 1.1, 3.6, .55, 1.5);

/* ---------- 2) SINIF / BİLİŞİM LABI ---------- */
const CX = 40;
const cls = new THREE.Group(); cls.position.x = CX; scene.add(cls);
const tile = rep(pixTex(16, 16, (g) => { g.fillStyle = '#d9d4c7'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#b8b2a3'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8); }), 12, 10);
block(cls, L(tile), 12, .1, 10, 0, -.05, 0);
const sWall = rep(pixTex(16, 32, (g) => { g.fillStyle = '#efe6c8'; g.fillRect(0, 0, 16, 32); g.fillStyle = '#4f8a6a'; g.fillRect(0, 21, 16, 11); g.fillStyle = '#3a6b51'; g.fillRect(0, 21, 16, 1); }), 6, 1);
block(cls, L(sWall), 12, 3.5, .1, 0, 1.75, -5); block(cls, L(sWall), .1, 3.5, 10, -6, 1.75, 0);
// sağ duvar kapı boşluklu
block(cls, L(sWall), .1, 3.5, 6.2, 6, 1.75, -1.9); block(cls, L(sWall), .1, 3.5, 2.2, 6, 1.75, 3.9); block(cls, L(sWall), .1, 1.2, 1.6, 6, 2.9, 2.0);
const boardTex = pixTex(512, 192, (g) => { g.fillStyle = '#1f3d2b'; g.fillRect(0, 0, 512, 192); g.strokeStyle = '#a0784a'; g.lineWidth = 14; g.strokeRect(0, 0, 512, 192);
  g.fillStyle = '#f0f0f0'; g.font = '700 34px "DejaVu Sans",sans-serif'; g.fillText('BİLİŞİM TEKNOLOJİLERİ', 34, 64); g.font = '400 26px "DejaVu Sans",sans-serif'; g.fillText('Konu: Bilgisayar güvenliği', 34, 112); g.fillText('"Bilinmeyen mod indirmeyiniz!"', 34, 152); }, true);
block(cls, L(boardTex), 5, 1.9, .05, 0, 1.9, -4.93);
const doorPivot = new THREE.Group(); doorPivot.position.set(6, 0, 1.2); cls.add(doorPivot);
const doorTex = pixTex(16, 32, (g) => { noisy(g, 16, 32, [130, 85, 50], 16); g.fillStyle = '#d8d8d8'; g.fillRect(2, 4, 12, 6); g.fillStyle = '#e8c14a'; g.fillRect(12, 17, 2, 2); });
block(doorPivot, L(doorTex), .08, 2.3, 1.6, 0, 1.15, .8);
const signTex = pixTex(128, 40, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 40); g.fillStyle = '#123'; g.font = '900 22px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('9-B LAB', 64, 28); }, true);
block(cls, L(signTex), .04, .3, .9, 5.94, 2.6, -.2);
// lab masası + 3 bilgisayar
const labDesk = L(planks([200, 200, 205]));
block(cls, labDesk, 5.4, .1, 1.1, 0, .78, -1.6);
[-2.5, 2.5].forEach(x => block(cls, C('#888'), .1, .78, 1, x, .39, -1.6));
const labMons = [-1.6, 0, 1.6].map(x => makeMonitor(cls, x, .83, -1.8));
const labTowers = [-1.6, 0, 1.6].map(x => block(cls, C('#d0d0d0'), .3, .7, .6, x + .6, .35, -1.8));
[-1.6, 0, 1.6].forEach(x => block(cls, C('#2b2b2b'), .7, .06, .28, x, .86, -1.3));
[-1.6, 0, 1.6].forEach(x => { block(cls, C('#3355aa'), .5, .07, .5, x, .45, -.55); block(cls, C('#3355aa'), .5, .6, .07, x, .78, -.28); block(cls, C('#555'), .07, .45, .07, x, .22, -.55); });
// arka sıralar (dekor)
[[-3.6, 2.4], [3.2, -3.6], [-3.6, -3.6]].forEach(([x, z]) => { block(cls, L(planks([170, 130, 80])), 1.6, .08, .9, x, .75, z); block(cls, C('#777'), .08, .75, .8, x - .7, .37, z); block(cls, C('#777'), .08, .75, .8, x + .7, .37, z); });

/* ---------- 3) KORİDOR → MÜDÜR ODASI ---------- */
const KX = 80;
const cor = new THREE.Group(); cor.position.x = KX; scene.add(cor);
block(cor, L(rep(pixTex(16, 16, (g) => { g.fillStyle = '#d9d4c7'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#b8b2a3'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8); }), 4, 18)), 4, .1, 18, 0, -.05, -5);
const cWall = rep(pixTex(16, 32, (g) => { g.fillStyle = '#efe6c8'; g.fillRect(0, 0, 16, 32); g.fillStyle = '#4f8a6a'; g.fillRect(0, 21, 16, 11); }), 9, 1);
block(cor, L(cWall), .1, 3.2, 18, -2, 1.6, -5); block(cor, L(cWall), .1, 3.2, 18, 2, 1.6, -5);
block(cor, L(rep(pixTex(16, 32, (g) => { g.fillStyle = '#efe6c8'; g.fillRect(0, 0, 16, 32); g.fillStyle = '#4f8a6a'; g.fillRect(0, 21, 16, 11); }), 2, 1)), 4, 3.2, .1, 0, 1.6, -14);
block(cor, L(pixTex(16, 32, (g) => { noisy(g, 16, 32, [90, 50, 30], 14); g.fillStyle = '#e8c14a'; g.fillRect(12, 17, 2, 2); })), 1.4, 2.3, .08, 0, 1.15, -13.94);
const mudurTex = pixTex(256, 64, (g) => { g.fillStyle = '#b8860b'; g.fillRect(0, 0, 256, 64); g.fillStyle = '#fff6d0'; g.fillRect(6, 6, 244, 52); g.fillStyle = '#5a1010'; g.font = '900 34px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('MÜDÜR ODASI', 128, 45); }, true);
block(cor, L(mudurTex), 1.8, .45, .04, 0, 2.6, -13.9);
for (let z = -1; z > -13; z -= 3) { block(cor, new THREE.MeshBasicMaterial({ color: '#fffbe0' }), 1, .05, .3, 0, 3.15, z); }

/* ---------- KARAKTERLER ---------- */
function faceTex(kind, o) {
  return pixTex(8, 8, g => {
    const P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
    g.fillStyle = o.skin; g.fillRect(0, 0, 8, 8);
    for (let x = 0; x < 8; x++) P(x, 0, o.hair); [0, 7].forEach(x => P(x, 1, o.hair)); if (o.bangs) for (let x = 0; x < 6; x++) P(x, 1, o.hair);
    const E = o.eye || '#4b3a8c', M = '#4a1e10';
    P(3, 5, o.nose || '#9a6040'); P(4, 5, o.nose || '#9a6040');
    if (kind === 'happy' || kind === 'talk') {
      P(1, 4, '#fff'); P(2, 4, E); P(5, 4, E); P(6, 4, '#fff');
      if (kind === 'happy') { P(1, 6, M); P(6, 6, M); for (let x = 2; x <= 5; x++) P(x, 7, M); for (let x = 2; x <= 5; x++) P(x, 6, '#fff'); }
      else { for (let x = 2; x <= 5; x++) { P(x, 6, M); P(x, 7, M); } P(3, 7, '#c0404a'); P(4, 7, '#c0404a'); }
    } else if (kind === 'sneaky') {
      P(1, 4, E); P(2, 4, E); P(5, 4, E); P(6, 4, E); for (const x of [1, 2, 5, 6]) P(x, 3, o.hair);
      P(2, 6, M); P(3, 6, M); P(4, 6, M); P(5, 6, '#fff'); P(6, 5, M);
    } else if (kind === 'shock') {
      for (const ex of [1, 5]) { P(ex, 3, '#fff'); P(ex + 1, 3, '#fff'); P(ex, 4, '#fff'); P(ex + 1, 4, '#fff'); }
      P(2, 4, '#111'); P(5, 4, '#111'); for (const x of [1, 2, 5, 6]) P(x, 2, o.hair);
      P(3, 6, '#2a0d06'); P(4, 6, '#2a0d06'); P(3, 7, '#2a0d06'); P(4, 7, '#2a0d06');
    } else if (kind === 'angry') {
      P(1, 2, '#111'); P(2, 3, '#111'); P(6, 2, '#111'); P(5, 3, '#111');
      P(1, 4, '#fff'); P(2, 4, '#c00'); P(5, 4, '#c00'); P(6, 4, '#fff');
      for (let x = 2; x <= 5; x++) P(x, 6, M); P(1, 7, M); P(6, 7, M);
    } else if (kind === 'scared') {
      P(1, 3, '#fff'); P(2, 3, '#111'); P(5, 3, '#111'); P(6, 3, '#fff'); P(2, 2, o.hair); P(5, 2, o.hair);
      for (let y = 4; y < 8; y++) { P(1, y, '#57c7ff'); P(6, y, '#57c7ff'); }
      P(2, 7, M); P(3, 6, M); P(4, 6, M); P(5, 7, M);

    if (lp) { const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); n = f2; }
    n.connect(g); g.connect(dest);
    if (vib) { const l = ac.createOscillator(); l.frequency.value = 6; const lg = ac.createGain(); lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(s); l.stop(s + dur + .05); }
    o.start(s); o.stop(s + dur + .05);
  }
  function noise(s, dur, vol, freq, type = 'lowpass', dest = master) {
    s += T; const n = ac.createBufferSource(); n.buffer = nbuf; n.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); env(g, s, dur, vol, .004); n.connect(f); f.connect(g); g.connect(dest); n.start(s); n.stop(s + dur + .05);
  }
  const dist = ac.createWaveShaper(); { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) c[i] = Math.tanh((i / 512 - 1) * 9); dist.curve = c; }
  const dg = ac.createGain(); dg.gain.value = .55; dist.connect(dg); dg.connect(master);
  function boom(s, big) { tone('sine', big ? 150 : 120, s, big ? 2.2 : 1, 1, { fEnd: 32 }); noise(s, big ? .7 : .35, .7, 500);
    if (big) { tone('sine', 110, s, 1.8, .9, { fEnd: 30, dest: dist }); noise(s, 1, .5, 1200, 'lowpass', dist); tone('sawtooth', 220, s, 1.2, .25, { fEnd: 55 }); } }
  function mumble(s, dur, base) { for (let x = 0; x < dur; x += .085) tone('square', base * (1 + (hash(s * 10 + x * 37) - .5) * .5), s + x, .07, .05, { lp: 1600 }); }
  const keys = (a, b) => { for (let x = a; x < b; x += .11) noise(x + hash(x) * .05, .025, .08, 3000, 'highpass'); };

  // 1: gece lo-fi + klavye
  const BEAT = .5; const ch = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  for (let i = 0; i < 9; i++) ch[(i / 2 | 0) % 4].forEach(m => tone('triangle', mtof(m), i * BEAT, BEAT * 1.9, .05));
  keys(.2, 4.1);
  tone('sine', mtof(84), 4.2, .25, .2); tone('sine', mtof(88), 4.35, .25, .2); tone('sine', mtof(91), 4.5, .6, .2);
  // 2: jenny mod "müziği" + fan
  const mel = [76, 79, 83, 79, 76, 74, 76, 71];
  for (let i = 0; i * .19 < 4.4; i++) { tone('square', mtof(mel[i % 8]), 5 + i * .19, .17, .07); if (i % 2 === 0) tone('triangle', mtof(52), 5 + i * .19, .3, .2); }
  noise(5, 4.4, .05, 300); mumble(6.6, 1.3, 260);
  // 3: zil + konuşmalar
  for (let i = 0; i < 12; i++) tone('square', 1200, 9.5 + i * .07, .05, .05);
  mumble(9.9, 2.3, 250); tone('sawtooth', 300, 12.2, .4, .15, { fEnd: 700, lp: 2000 });
  mumble(13.3, 1.1, 330); for (let i = 0; i < 6; i++) tone('square', mtof(72 + [0, 4, 7, 12, 7, 12][i]), 13.2 + i * .12, .1, .08);
  // 4: hype chiptune (kasarak) + fanlar
  const m2 = [72, 76, 79, 84, 83, 79, 76, 79];
  for (let i = 0; i * .2 < 5; i++) { if (hash(i * 3) > .82) continue; tone('square', mtof(m2[i % 8]), 14.5 + i * .2, .18, .07); if (i % 2 === 0) tone('triangle', mtof(48), 14.5 + i * .2, .35, .2); }
  keys(14.6, 17); noise(14.5, 5, .07, 350); mumble(17.3, .8, 300); mumble(18.2, 1.2, 250);
  // 5: kapı gıcırtısı, adımlar, Ali'nin daveti, kayıt cızırtısı
  tone('sawtooth', 180, 19.5, .6, .08, { fEnd: 420, lp: 900, vib: 30 });
  for (let i = 0; i < 6; i++) noise(19.8 + i * .2, .05, .18, 700, 'bandpass');
  mumble(20.6, 2.0, 250);
  noise(22.6, .35, .5, 2500, 'bandpass'); tone('sawtooth', 900, 22.6, .35, .15, { fEnd: 120 });
  // 6: dev bum + drone
  boom(23, true); tone('sawtooth', 55, 23.2, 3.8, .09, { lp: 300 }); tone('sawtooth', 58.27, 23.2, 3.8, .06, { lp: 300 });
  mumble(23.1, 1.6, 140);
  // 7: dun dun dunnn + adımlar
  for (let i = 0; i < 16; i++) noise(27 + i * .22, .05, .14, 600, 'bandpass');
  [[62, .45], [62, .45], [57, 1.6]].forEach(([m, d], i) => { tone('sawtooth', mtof(m - 12), 28.4 + i * .5, d, .2, { lp: 900, vib: i === 2 ? 4 : 0 }); tone('triangle', mtof(m), 28.4 + i * .5, d, .18); });
  // 8: terlik vınnn + şaplak
  tone('sine', 400, 30.5, 1.2, .1, { fEnd: 1400 }); noise(30.5, 1.2, .15, 1500, 'bandpass');
  noise(31.7, .12, 1, 3000, 'highpass'); boom(31.7, false);
  tone('triangle', mtof(62), 32.1, .35, .2); tone('triangle', mtof(61), 32.5, .35, .2); tone('triangle', mtof(60), 32.9, 1.0, .2, { vib: 3 });
}

/* ---------- oynatma ---------- */
function resize() { const r = stageRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderAt(0);

if (RENDER_MODE) {
  window.renderAt = t => renderAt(t); window.DUR = DUR;
  window.renderAudioWav = async () => {
    const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oac, 0); const buf = await oac.startRendering();
    const n = buf.length, d = new DataView(new ArrayBuffer(44 + n * 4)); const S = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
    S(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); S(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
    d.setUint32(24, sr, true); d.setUint32(28, sr * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); S(36, 'data'); d.setUint32(40, n * 4, true);
    const a = buf.getChannelData(0), b = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, clamp(a[i], -1, 1) * 32767, true); d.setInt16(46 + i * 4, clamp(b[i], -1, 1) * 32767, true); }
    const u8 = new Uint8Array(d.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.READY = true;
} else {
  let ac = null, start = 0; const now = () => ac ? ac.currentTime : performance.now() / 1000;
  const schedule = () => { start = now() + .08; if (ac) buildAudio(ac, start); };
  $('play').onclick = async () => {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume(); } catch (e) { ac = null; }
    $('ui').style.display = 'none'; schedule();
    (function loop() { let t = now() - start; if (t >= DUR) { schedule(); t = 0; } renderAt(Math.max(0, t)); requestAnimationFrame(loop); })();
  };
}
