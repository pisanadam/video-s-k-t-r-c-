<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biyolojik Silah</title>
<style>
  :root{ --meme: Impact, "Anton", "Arial Black", "DejaVu Sans", sans-serif; --sig:"DejaVu Sans", sans-serif; --gold:#ffd84a; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;container-type:inline-size;overflow:hidden;background:#000}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;pointer-events:none}
  #vig{inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.7) 100%)}

  .meme{font-family:var(--meme);font-weight:900;color:#fff;text-transform:uppercase;-webkit-text-stroke:.9cqw #000;paint-order:stroke fill;letter-spacing:.04em;text-align:center;line-height:1.08}
  #cap{left:4cqw;right:4cqw;bottom:22cqw;font-size:7.6cqw}
  #top{left:4cqw;right:4cqw;top:9cqw;font-size:7cqw}
  #stamp{left:0;right:0;top:34%;font-size:17cqw;transform:translateY(-50%);opacity:0;white-space:nowrap}
  #bio{left:5cqw;right:5cqw;top:24cqw;padding:2.4cqw 0;background:#d10000;border:1.2cqw solid #ffe600;font:900 8.4cqw/1 var(--meme);letter-spacing:.05em;text-align:center;color:#fff;opacity:0;
    box-shadow:0 0 6cqw rgba(255,0,0,.9);text-shadow:0 .6cqw 0 #000}
  #bio small{display:block;font:700 3.2cqw/1.2 var(--sig);letter-spacing:.25em;color:#ffe600;margin-top:1.2cqw;text-shadow:none}
  #lvl{right:4cqw;top:5cqw;padding:1.4cqw 2.4cqw;border-radius:2cqw;background:rgba(0,0,0,.6);border:.6cqw solid #58ff3a;font:900 5cqw/1 var(--meme);color:#58ff3a;white-space:nowrap;opacity:0;text-shadow:0 0 2cqw #58ff3a}
  #lvl small{display:block;font:700 2.3cqw/1 var(--sig);letter-spacing:.25em;color:#bfffb0;margin-bottom:.8cqw;text-shadow:none}
  #title{left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;font:900 15cqw/1.02 var(--meme);letter-spacing:.06em;color:#fff;
    text-shadow:0 0 5cqw rgba(88,255,58,.9),0 0 2cqw rgba(255,140,0,.7);opacity:0}
  #small{left:0;right:0;top:58%;text-align:center;font:400 4cqw/1.4 var(--sig);letter-spacing:.3em;color:#ddd;opacity:0;text-transform:lowercase}
  #flash{inset:0;background:#fff;opacity:0}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3cqw;background:rgba(0,0,0,.7);z-index:10;font-family:var(--sig)}
  #ui button{font:900 7cqw/1 var(--meme);padding:3cqw 6cqw;border:.6cqw solid #58ff3a;cursor:pointer;background:#111;color:var(--gold);letter-spacing:.1em}
  #ui .hint{font-size:3.2cqw;color:#bbb;letter-spacing:.2em;text-align:center}
  #bar{position:absolute;left:0;bottom:0;height:.8cqw;background:#58ff3a;width:0;z-index:5}
  #sansur{position:absolute;pointer-events:none;transform:translate(-50%,-50%);background-size:100% 100%;image-rendering:pixelated;opacity:0;border:.6cqw solid #000;display:flex;align-items:center;justify-content:center;z-index:2;
    background:repeating-conic-gradient(#7a4a22 0 25%,#a8743e 0 50%) 0 0/25% 25%}
  #sansur::after{content:"SANSÜR";background:#000;color:#fff;font:900 4.6cqw/1 Impact,"DejaVu Sans",sans-serif;letter-spacing:.2em;padding:1cqw 2.4cqw}
  #emo{position:absolute;pointer-events:none;font-size:20cqw;line-height:1;opacity:0;transform:translate(-50%,-50%);z-index:3}
  body.render #ui,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig" class="ov"></div>
  <div id="redv" class="ov"></div>
  <div id="lvl" class="ov"><small>TEHDİT SEVİYESİ</small><span id="lvlV"></span></div>

  <div id="top" class="ov meme"></div>
  <div id="cap" class="ov meme"></div>
  <div id="stamp" class="ov meme"></div>

  <div id="small" class="ov"></div>
  <div id="flash" class="ov"></div>
  <div id="bar"></div>
  <div id="ui">
    <button id="play">▶ OYNAT</button>
    <div class="hint">FEN DERSİ · BİYOLOJİK SİLAH · UZAY</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const QS = new URLSearchParams(location.search);
const DUR = 25;
const RENDER_MODE = QS.has('render');
if (RENDER_MODE) document.body.classList.add('render');

/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const R = rng(11);

function pixTex(w, h, draw, linear = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (!linear) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noisy(g, w, h, base, vary, r = R) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = (r() - .5) * vary;
    g.fillStyle = `rgb(${clamp(base[0] + v, 0, 255)},${clamp(base[1] + v, 0, 255)},${clamp(base[2] + v, 0, 255)})`; g.fillRect(x, y, 1, 1); }
}
const planks = (base) => pixTex(16, 16, (g, w, h) => { noisy(g, w, h, base, 22); g.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1); g.fillRect(7, 0, 1, 4); g.fillRect(2, 4, 1, 4); g.fillRect(11, 8, 1, 4); g.fillRect(5, 12, 1, 4); });
function rep(t, x, y) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; }

/* ---------- sahne ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16 / 9, .05, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#555', 1.1); scene.add(hemi);
const dir = new THREE.DirectionalLight('#fff4e0', 1.2); dir.position.set(5, 10, 6); scene.add(dir);
const pink = new THREE.PointLight('#ff4fa8', 0, 6, 1.5); scene.add(pink);

const L = (m, o = {}) => new THREE.MeshLambertMaterial({ map: m, ...o });
const C = c => new THREE.MeshLambertMaterial({ color: c });
const BOX = new THREE.BoxGeometry(1, 1, 1);
function block(parent, mat, sx, sy, sz, x, y, z) { const m = new THREE.Mesh(BOX, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m; }

/* ======================= DÜNYA ======================= */
const ADD = (c, o = .9) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const G = {};
const grp = (name, x) => { const g = new THREE.Group(); g.position.x = x; scene.add(g); G[name] = g; return g; };
function setVis(n) { Object.entries(G).forEach(([k, g]) => g.visible = k === n); }

/* --- 1) FEN LABORATUVARI --- */
const lab = grp('lab', 0);
block(lab, L(rep(pixTex(16, 16, (g) => { g.fillStyle = '#e9e6dc'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#c9c4b5'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8); }), 10, 12)), 10, .1, 12, 0, -.05, 0);
const labW = L(rep(pixTex(16, 32, (g) => { g.fillStyle = '#e8f1ea'; g.fillRect(0, 0, 16, 32); g.fillStyle = '#5c9c86'; g.fillRect(0, 22, 16, 10); g.fillStyle = '#3f7a65'; g.fillRect(0, 21, 16, 1); }), 5, 1));
block(lab, labW, 10, 3.6, .1, 0, 1.8, -6); block(lab, labW, .1, 3.6, 12, -5, 1.8, 0); block(lab, labW, 10, 3.6, .1, 0, 1.8, 6);
block(lab, labW, .1, 3.6, 7.6, 5, 1.8, -2.2); block(lab, labW, .1, 3.6, 3, 5, 1.8, 4.5); block(lab, labW, .1, 1.2, 1.4, 5, 3.0, 2.3);
block(lab, new THREE.MeshBasicMaterial({ color: '#fff6d8' }), .05, 2.4, 1.4, 5.6, 1.2, 2.3);   // koridor ışığı
const door = new THREE.Group(); door.position.set(5, 0, 1.6); lab.add(door); block(door, L(planks([140, 96, 58])), .08, 2.4, 1.4, 0, 1.2, .7);
block(lab, C('#f4f2ec'), 10, .1, 12, 0, 3.6, 0);
block(lab, C('#1f4d36'), 5, 1.7, .06, .4, 1.95, -5.94); block(lab, C('#8a6a3a'), 5.2, .08, .1, .4, 1.08, -5.9);
const boardT = pixTex(256, 88, (g) => { g.fillStyle = '#1f4d36'; g.fillRect(0, 0, 256, 88); g.fillStyle = '#f0f0e8'; g.font = '700 15px "DejaVu Sans",sans-serif'; g.textAlign = 'left';
  g.fillText('KONU: GAZLAR VE BASINÇ', 12, 22); g.fillText('P · V = n · R · T', 12, 46); g.fillText('DİKKAT: KAPALI ORTAMDA', 12, 70); g.fillStyle = '#ffd84a'; g.fillText('GAZ ÇIKARMAYIN', 150, 70); }, true);
const boardM = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.7), new THREE.MeshBasicMaterial({ map: boardT })); boardM.position.set(.4, 1.95, -5.9); lab.add(boardM);
const ptT = pixTex(18, 10, (g) => { const cs = ['#ff7a7a', '#ffb36b', '#ffe66b', '#8be38b', '#7ac8ff', '#c49bff']; for (let y = 0; y < 10; y++) for (let x = 0; x < 18; x++) { if (y === 0 && x > 0 && x < 17) continue; if ((y === 1 || y === 2) && x > 1 && x < 12) continue; if (y >= 8 && (x < 2 || x > 15)) continue; g.fillStyle = cs[(x + y * 3) % 6]; g.fillRect(x, y, 1, 1); } });
block(lab, L(ptT), .02, 1.0, 1.8, -4.94, 2.2, -3.2);
const warnT = pixTex(64, 64, (g) => { g.fillStyle = '#ffd400'; g.beginPath(); g.moveTo(32, 4); g.lineTo(62, 58); g.lineTo(2, 58); g.closePath(); g.fill(); g.fillStyle = '#000'; g.font = '900 34px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('!', 32, 52); }, true);
const warnM = new THREE.Mesh(new THREE.PlaneGeometry(.7, .7), new THREE.MeshBasicMaterial({ map: warnT, transparent: true })); warnM.position.set(3.9, 2.3, -5.92); lab.add(warnM);
const TUBEC = ['#58ff3a', '#ff4fa8', '#3ad7ff', '#ffb21a'];
const tubes = []; const BENCH = [];
[-3.2, -.6, 2.0].forEach((z, r) => [-2, 2].forEach((x, c) => {
  BENCH.push([x, z]);
  block(lab, C('#d8dde0'), 2.4, .86, .8, x, .43, z); block(lab, C('#1c1c1c'), 2.5, .08, .9, x, .9, z);
  block(lab, C('#8a6a3a'), .7, .06, .16, x - .6, 1.0, z - .1);
  for (let i = 0; i < 4; i++) { const tb = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .34, 10), new THREE.MeshBasicMaterial({ color: TUBEC[(i + r + c) % 4], transparent: true, opacity: .85 })); tb.position.set(x - .9 + i * .14, 1.12, z - .1); lab.add(tb); tubes.push(tb); }
  const fl = new THREE.Mesh(new THREE.ConeGeometry(.16, .32, 14), new THREE.MeshBasicMaterial({ color: TUBEC[(r * 2 + c + 1) % 4], transparent: true, opacity: .8 })); fl.position.set(x + .5, 1.1, z - .15); lab.add(fl); tubes.push(fl);
  [-.6, .6].forEach(dx => { block(lab, C('#555'), .36, .06, .36, x + dx, .62, z + .78); block(lab, C('#777'), .06, .6, .06, x + dx, .3, z + .78); });
}));
const gasL = new THREE.PointLight('#58ff3a', 0, 14, 1.2); scene.add(gasL);
const cloud = []; for (let i = 0; i < 46; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 9), new THREE.MeshBasicMaterial({ color: i % 5 ? '#62f23a' : '#b6ff4a', transparent: true, opacity: .3, depthWrite: false })); m.visible = false; scene.add(m); cloud.push(m); }
const rings = []; for (let i = 0; i < 6; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, .07, 8, 56), ADD('#7dff4a')); m.visible = false; scene.add(m); rings.push(m); }
const papers = []; for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(BOX, C(i % 4 ? '#fafafa' : '#ffe9a8')); m.scale.set(.3, .006, .4); m.visible = false; scene.add(m); papers.push(m); }

/* --- 2) OKUL ÖNÜ / SOKAK --- */
const SX = 100, st = grp('street', SX);
block(st, L(rep(pixTex(16, 16, (g, w, h) => noisy(g, w, h, [70, 72, 78], 16)), 8, 30)), 10, .1, 60, 0, -.05, -12);
block(st, C('#f2f2f2'), .18, .02, 60, 0, .01, -12);
const sideT = rep(pixTex(16, 16, (g, w, h) => { noisy(g, w, h, [168, 166, 160], 14); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16); }), 2, 30);
block(st, L(sideT), 2.5, .2, 60, -6.25, .1, -12); block(st, L(sideT), 2.5, .2, 60, 6.25, .1, -12);
const schoolT = rep(pixTex(32, 32, (g) => { g.fillStyle = '#e9d7b0'; g.fillRect(0, 0, 32, 32); g.fillStyle = '#c7b18a'; g.fillRect(0, 30, 32, 2); g.fillStyle = '#7fb6e0'; g.fillRect(8, 8, 16, 14); g.fillStyle = '#fff'; g.fillRect(15, 8, 2, 14); g.fillRect(8, 14, 16, 2); }), 9, 3);
block(st, L(schoolT), 3, 9, 28, -9, 4.5, -4); block(st, C('#a33b2b'), 3.4, .5, 28.4, -9, 9.2, -4);
block(st, C('#3a2a1a'), .1, 2.4, 1.8, -7.48, 1.2, 0); block(st, C('#ffefc0'), .08, 2.2, .06, -7.45, 1.2, 0);
const signT = pixTex(160, 32, (g) => { g.fillStyle = '#123a6b'; g.fillRect(0, 0, 160, 32); g.fillStyle = '#fff'; g.font = '900 20px "DejaVu Sans",sans-serif'; g.textAlign = 'center'; g.fillText('ORTAOKUL', 80, 24); }, true);
const signM = new THREE.Mesh(new THREE.PlaneGeometry(4, .8), new THREE.MeshBasicMaterial({ map: signT })); signM.rotation.y = Math.PI / 2; signM.position.set(-7.45, 3.0, 0); st.add(signM);
const brickT = () => pixTex(16, 16, (g, w, h) => { noisy(g, w, h, [150, 64, 44], 26); g.fillStyle = '#cfc6b8'; for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1); for (let y = 0; y < 16; y += 4) { const o = (y / 4) % 2 ? 0 : 4; g.fillRect(o + 3, y, 1, 3); g.fillRect(o + 11, y, 1, 3); } });
block(st, L(rep(brickT(), 24, 2)), .5, 2.6, 46, 7.6, 1.3, -11);
block(st, L(rep(brickT(), 8, 3)), 16, 4.2, .6, 0, 2.1, -34.3);
block(st, L(rep(brickT(), 8, 3)), .6, 4.2, 14, -7.6, 2.1, -27);
[[-2, 12], [6, 9], [-14, 11]].forEach(([z, h], i) => block(st, C(['#9aa7b8', '#b8a89a', '#a8b89a'][i]), 6, h, 7, 13, h / 2, z));
const flashR = new THREE.PointLight('#ff2020', 0, 30, 1.2), flashB = new THREE.PointLight('#2050ff', 0, 30, 1.2); scene.add(flashR, flashB);

/* --- 3) GÖKYÜZÜ --- */
const SKX = 300, sky = grp('sky', SKX);
const clouds = []; for (let i = 0; i < 22; i++) { const g = new THREE.Group(); const n = 3 + (i % 3); for (let j = 0; j < n; j++) block(g, new THREE.MeshLambertMaterial({ color: '#ffffff', emissive: '#9aa4b8' }), 2 + hash(i * 9 + j) * 3, 1 + hash(i + j * 5), 2 + hash(j + i * 3) * 2, (j - n / 2) * 1.6, hash(i * 3 + j) * .8, hash(j * 7 + i) * 1.4);
  const a = hash(i * 13) * Math.PI * 2, r = 5 + hash(i * 17) * 14; g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); g.userData = { y0: hash(i * 23) * 80 }; sky.add(g); clouds.push(g); }

/* --- 4) UZAY --- */
const SPX = 600, sp = grp('space', SPX);
{ const N = 1600, pos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const u = hash(i * 1.7) * 2 - 1, a = hash(i * 3.1) * Math.PI * 2, r = 280; pos[i * 3] = Math.sqrt(1 - u * u) * Math.cos(a) * r; pos[i * 3 + 1] = u * r; pos[i * 3 + 2] = Math.sqrt(1 - u * u) * Math.sin(a) * r; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); sp.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#ffffff', size: 1.4, sizeAttenuation: false }))); }
const planetT = pixTex(256, 128, (g, w, h) => { const r = rng(5); g.fillStyle = '#1e5fbf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { const x = r() * w, y = 20 + r() * 88, s = 8 + r() * 26; g.fillStyle = r() < .6 ? '#3f9a3a' : '#b89a5a'; for (let k = 0; k < 14; k++) g.fillRect(x + (r() - .5) * s * 2, y + (r() - .5) * s, s * .6, s * .4); }
  g.fillStyle = 'rgba(255,255,255,.75)'; for (let i = 0; i < 60; i++) g.fillRect(r() * w, r() * h, 10 + r() * 30, 2 + r() * 3); g.fillStyle = '#f4f8ff'; g.fillRect(0, 0, w, 8); g.fillRect(0, h - 8, w, 8); }, true);
const planet = new THREE.Mesh(new THREE.SphereGeometry(70, 64, 48), new THREE.MeshLambertMaterial({ map: planetT })); planet.position.set(0, -80, -26); sp.add(planet);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(73.5, 64, 48), new THREE.MeshBasicMaterial({ color: '#4fb0ff', transparent: true, opacity: .35, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })); atmo.position.copy(planet.position); sp.add(atmo);
const sunT = pixTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(.25, 'rgba(255,230,160,.8)'); gr.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }, true);
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); sun.position.set(-60, 30, -150); sun.scale.setScalar(40); sp.add(sun);

/* --- itki alevi + duman --- */
const thr = new THREE.Group(); scene.add(thr);
const coneG = (r, h) => { const g = new THREE.ConeGeometry(r, h, 18, 1, true); g.rotateX(Math.PI); g.translate(0, -h / 2, 0); return g; };
const flO = new THREE.Mesh(coneG(.42, 2.2), ADD('#4dff2e', .75)); thr.add(flO);
const flM = new THREE.Mesh(coneG(.3, 1.6), ADD('#ff8a1a', .85)); thr.add(flM);
const flI = new THREE.Mesh(coneG(.16, .9), ADD('#fff3b0', .95)); thr.add(flI);
const thrGlowT = pixTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,240,170,1)'); gr.addColorStop(.3, 'rgba(120,255,60,.7)'); gr.addColorStop(1, 'rgba(80,255,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }, true);
const thrGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: thrGlowT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); thr.add(thrGlow);
const thrL = new THREE.PointLight('#a8ff50', 0, 18, 1.2); thr.add(thrL);
const smoke = []; for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshLambertMaterial({ color: i % 3 ? '#cfd6c4' : '#a9c98f', transparent: true, opacity: .55, depthWrite: false })); m.visible = false; scene.add(m); smoke.push(m); }

    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 4; const g = ac.createGain(); g.gain.setValueAtTime(0, ss); g.gain.linearRampToValueAtTime(v, ss + .03); for (let x = .03; x < d; x += .025) g.gain.setValueAtTime(v * (.45 + hash(s * 13 + x * 51) * .55), ss + x); g.gain.exponentialRampToValueAtTime(.0001, ss + d);
    o.connect(lp); lp.connect(g); g.connect(master); g.connect(dist); o.start(ss); o.stop(ss + d + .05); noise(s, d, v * .4, 260, 'bandpass'); }
  const plop = s => { tone('sine', 900, s, .12, .25, { fEnd: 180 }); noise(s, .05, .2, 800, 'bandpass'); };

  const tuba = (m, s, d = .25) => tone('sawtooth', mtof(m), s, d, .14, { lp: 500 });

  const geiger = (a, b, rate) => { for (let x = a; x < b; x += .02) if (hash(x * 977) < rate) noise(x, .008, .25, 3000, 'highpass'); };
  const siren = (a, b) => { for (let s = a; s < b - .1; s += 1.0) { tone('sine', 640, s, .5, .09, { fEnd: 1180 }); tone('sine', 1180, s + .5, .5, .09, { fEnd: 640 }); } };
  // LAB
  const LABM = [72, 76, 79, 76, 74, 77, 81, 77, 72, 76, 79, 84, 83, 79, 76, 74];
  LABM.forEach((m, i) => { const s = .1 + i * .13; if (s < FRZ) pluck(m, s); }); for (let i = 0; i < 4; i++) tuba([48, 43, 45, 41][i], .1 + i * .52, .3);
  for (let i = 0; i < 14; i++) tone('sine', 500 + hash(i) * 700, .2 + hash(i + 3) * 1.9, .06, .05, { fEnd: 1400 });
  mumble(.3, 1.7, 210);
  scratch(FRZ); [2.45, 2.75, 3.0, 3.15, 3.27].forEach(s => { tone('sine', 70, s, .18, .6, { fEnd: 40 }); });
  tone('sine', 140, 2.8, .5, .2, { fEnd: 60, vib: 20 });
  fart(BL, 1.5, 68, .75); boom(BL, true); noise(BL, 1.2, .3, 900, 'bandpass');
  for (let i = 0; i < 12; i++) tone('sine', 2400 + hash(i * 5) * 2200, BL + .05 + hash(i * 7) * 1.1, .15, .07);
  for (let v = 0; v < 4; v++) for (let x = BL + .25 + v * .1; x < EMP - .3; x += .1) tone('square', (650 + v * 120) * (1 + Math.sin(x * 30 + v) * .25), x, .09, .025, { lp: 2400 });
  steps(BL + .3, EMP - .2, .06, .14); for (let i = 0; i < 10; i++) noise(BL + .2 + i * .17, .12, .12, 5000, 'highpass');
  for (let x = BL + .5; x < CUT - .2; x += .5) tone('square', (x * 2 | 0) % 2 ? 880 : 660, x, .22, .04);
  for (let x = EMP + .1; x < CUT - .1; x += .32) { tone('sine', 4600, x, .04, .03); tone('sine', 4600, x + .06, .04, .03); }
  // SOKAK
  siren(CUT, LIFT); phonk(CUT + .2, CORN, { bpm: 145, root: 38, mel: MEL1 }); geiger(CUT, CORN, .1);
  for (let x = CUT + .4; x < CORN; x += .4) tone('square', 1800, x, .05, .04);
  steps(CUT, CORN, .1, .1);
  tone('sawtooth', 55, CORN, SQ - CORN, .12, { lp: 300 }); geiger(CORN, LIFT, .35); boom(CORN, false);
  [45, 48, 50, 51, 52].forEach((m, i) => tuba(m, SNK + .1 + i * .14, .2)); tone('triangle', mtof(76), SNK + .85, .3, .08);
  riser(SQ, LIFT - SQ); noise(SQ, LIFT - SQ, .25, 140); fart(SQ + .2, LIFT - SQ - .2, 45, .3);
  // FIRLATMA
  boom(LIFT, true); fart(LIFT, 1.8, 60, .8); noise(LIFT, PUNCH - LIFT, .35, 420); noise(LIFT, PUNCH - LIFT, .12, 2600, 'bandpass');
  for (let s = LIFT + 1.6; s < PUNCH - .2; s += .45) fart(s, .5, 55 + hash(s) * 30, .45);
  choir([57, 61, 64, 69], SKY, PUNCH - SKY, .05); phonk(SKY, PUNCH, { bpm: 150, root: 45, mel: MEL2 });
  [0, 1, 2].forEach(i => tone('sawtooth', 300 + i * 200, SKY + i, .9, .06, { fEnd: 900 + i * 300 }));
  // UZAY
  boom(PUNCH, true); noise(PUNCH, .5, .5, 3000, 'highpass');
  choir([60, 64, 67, 71], PUNCH + .3, END - PUNCH, .028); tone('sine', mtof(84), PUNCH + .6, 3, .03, { vib: 3 });
  for (let i = 0; i < 6; i++) tone('sine', mtof([88, 91, 86, 93, 84, 91][i]), PUNCH + .8 + i * .55, .5, .025);
  boom(LOOK + .1, false); tone('sine', mtof(96), LOOK + .45, .5, .06);
  beep(DROP + .05, .75); fart(DROP + .15, .55, 95, .45); plop(FALL + .05);
  noise(FALL + 1.0, 1.0, .25, 1200, 'bandpass'); tone('sine', 300, FALL + 1.0, 1.0, .06, { fEnd: 90 }); boom(FALL + 2.0, false);
  [72, 76, 79, 84].forEach((m, i) => { tone('triangle', mtof(m), END + .2 + i * .16, i === 3 ? 1.4 : .2, .09); tone('square', mtof(m - 12), END + .2 + i * .16, .15, .03); });
  choir([60, 64, 67, 72], END + .7, DUR - END - .7, .045); fart(END + 1.4, .4, 110, .35);
}

/* ---------- oynatma ---------- */
function resize() { const r = stageRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderAt(0);

if (RENDER_MODE) {
  window.renderAt = t => renderAt(t); window.DUR = DUR;
  window.renderAudioWav = async () => {
    const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oac, 0); const buf = await oac.startRendering();
    const n = buf.length, d = new DataView(new ArrayBuffer(44 + n * 4)); const S = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
    S(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); S(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
    d.setUint32(24, sr, true); d.setUint32(28, sr * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); S(36, 'data'); d.setUint32(40, n * 4, true);
    const a = buf.getChannelData(0), b = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, clamp(a[i], -1, 1) * 32767, true); d.setInt16(46 + i * 4, clamp(b[i], -1, 1) * 32767, true); }
    const u8 = new Uint8Array(d.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.READY = true;
} else {
  let ac = null, start = 0; const now = () => ac ? ac.currentTime : performance.now() / 1000;
  const schedule = () => { start = now() + .08; if (ac) buildAudio(ac, start); };
  $('play').onclick = async () => {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume(); } catch (e) { ac = null; }
    $('ui').style.display = 'none'; schedule();
    (function loop() { let t = now() - start; if (t >= DUR) { schedule(); t = 0; } renderAt(Math.max(0, t)); requestAnimationFrame(loop); })();
  };
}
